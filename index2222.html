      if (sV) { var r = sV.getDataRange().getValues(); for (var i=1; i<r.length; i++) if (r[i][0]) {
          var dateVal = r[i][0] instanceof Date ? r[i][0] : new Date(r[i][0]);
          dV.push({ data: Utilities.formatDate(dateVal, ss.getSpreadsheetTimeZone(), "dd/MM/yyyy"), item: r[i][1], venda: r[i][2], lucro: r[i][3] });
      }}
      if (sG) { var r = sG.getDataRange().getValues(); for (var i=1; i<r.length; i++) if (r[i][0]) {
          var dg = r[i][3] instanceof Date ? Utilities.formatDate(r[i][3], ss.getSpreadsheetTimeZone(), "dd/MM/yyyy") : r[i][3];
          dG.push({ id: normalizeId(r[i][0]), descricao: r[i][1], valor: r[i][2], data: dg });
      }}
      return ContentService.createTextOutput(JSON.stringify({ estoque: dE, vendas: dV, gastos: dG })).setMimeType(ContentService.MimeType.JSON);
    }
    else if (type == 'save_settings') {
      var s = ss.getSheetByName("Config") || ss.insertSheet("Config");
      var d = s.getDataRange().getValues(); var m = {}; for(var i=0; i<d.length; i++) m[String(d[i][0]).trim()] = i+1;
      var ks = ["aluguel", "softwares", "ecommerce", "mei", "publicidade", "condominio", "kwh", "potencia", "precoMaq", "vidaUtil", "horasTrab", "embalagem", "markup", "pintSimples", "pintMedia", "pintProf", "FatPrevisto"];
      ks.forEach(function(k) { if (param[k] !== undefined) { 
        var val = param[k].replace(',', '.');
        if (m[k]) s.getRange(m[k], 2).setValue(val); else s.appendRow([k, val]); 
      }});
      return ContentService.createTextOutput("OK");
    }
    else if (type == 'gasto') {
      var s = ss.getSheetByName("Gastos") || ss.insertSheet("Gastos");
      var id = normalizeId(param.id || Date.now());
      s.appendRow([id, param.descricao, param.valor.replace(',', '.'), param.data || new Date()]);
      s.getRange(s.getLastRow(), 1).setNumberFormat('@');
      return ContentService.createTextOutput("OK");
    }
    else if (type == 'delete_gasto') {
      var s = ss.getSheetByName("Gastos"); if (!s) return ContentService.createTextOutput("Erro");

      if (finder) { s.deleteRow(finder.getRow()); return ContentService.createTextOutput("OK"); }

    }
    else if (type == 'venda') {

    else if (type == 'estoque') {

        const { useState, useEffect, useMemo, Fragment } = React;

                wallet: <path d="M20 12V8H6a2 2 0 012-2h12M4 10h16v10H4V10z" />,
                trash: <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" />,
                edit: <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 113 3L12 15l-4 1 1-4 9.5-9.5z" />,
                refresh: <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />,

                x: <path d="M18 6L6 18M6 6l12 12" />,
                check: <path d="M20 6L9 17l-5-5" />,
                whatsapp: <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 1 1-7.6-7.6 8.38 8.38 0 0 1 3.8.9L21 4.5z" />

        const App = () => {
            const [page, setPage] = useState('calc');
            const HARDCODED_URL = "https://script.google.com/macros/s/AKfycbx28rB657FbmmBk05Ljd_HuBCFAGNSaflknIeF_BNYfDVUvODiZb5ry_whruDHFjcMNuw/exec";
            
            const [state, setState] = useState(() => {
                const saved = JSON.parse(localStorage.getItem('333_vFINAL_stable'));
                const defaults = {
                    aluguel: 210, softwares: 95, ecommerce: 59.9, mei: 60, publicidade: 100, condominio: 100,
                    kwh: 1.14, potencia: 350, precoMaq: 1500, vidaUtil: 24, 
                    FatPrevisto: 4000, horasTrab: 160, embalagem: 3, markup: 2.5,
                    pintSimples: 15, pintMedia: 35, pintProf: 60,
                    urlWrite: HARDCODED_URL
                };
                return {
                    estoque: [], vendas: [], gastos: [], 
                    syncing: false, settings: saved ? { ...saved, urlWrite: HARDCODED_URL } : defaults
                };
            });

            const [calcForm, setCalcForm] = useState({ nome: '', tempo: 10, pintura: 'media', whatsapp: '', filamentos: [{ id: Date.now(), matIdx: 0, peso: 100 }] });
            const [matForm, setMatForm] = useState({ nome: '', peso: 1000, preco: 120, editing: false, oldName: '' });
            const [gastoForm, setGastoForm] = useState({ id: '', descricao: '', valor: '', editing: false });
            const [toast, setToast] = useState({ show: false, msg: '' });

            const notify = (msg) => { setToast({ show: true, msg }); setTimeout(() => setToast({ show: false, msg: '' }), 4000); };

            const sync = async () => {
                setState(prev => ({ ...prev, syncing: true }));
                try {
                    const response = await fetch(`${state.settings.urlWrite}?type=read_data&nocache=${Date.now()}`);
                    const data = await response.json();
                    
                    const settingsRes = await fetch(`${state.settings.urlWrite}?type=read_settings&nocache=${Date.now()}`);
                    const settingsData = await settingsRes.json();
                    
                    const newSettings = { ...state.settings, ...settingsData, urlWrite: HARDCODED_URL };
                    localStorage.setItem('333_vFINAL_stable', JSON.stringify(newSettings));

                    setState(prev => ({ 
                        ...prev, 
                        estoque: data.estoque || [], 
                        vendas: data.vendas || [], 
                        // TROCA SOLICITADA: Padronização de IDs de gastos
                        gastos: (data.gastos || []).map(g => ({
                            ...g,
                            id: String(g.id).trim().replace(/^g_/, ''),
                            valor: Number(g.valor)
                        })),
                        settings: newSettings,
                        syncing: false 
                    }));
                    notify("Sincronizado");
                } catch (e) { 
                    console.error(e);
                    setState(prev => ({ ...prev, syncing: false })); 
                    notify("Erro de Ligação"); 
                }
            };

            const saveSettingsToCloud = async () => {
                notify("A Guardar...");
                const q = new URLSearchParams();
                q.append("type", "save_settings");
                Object.keys(state.settings).forEach(key => { q.append(key, String(state.settings[key])); });
                try {
                    await fetch(`${state.settings.urlWrite}?${q.toString()}`, { method: 'GET', mode: 'no-cors' });
                    localStorage.setItem('333_vFINAL_stable', JSON.stringify(state.settings));
                    setTimeout(sync, 1500); 
                    notify("Configurações Salvas");
                } catch(e) { notify("Erro ao Salvar"); }
            };

            useEffect(() => { sync(); }, []);

            const fatTotal = useMemo(() => state.vendas.reduce((acc, v) => acc + (Number(v.venda) || 0), 0), [state.vendas]);
            const lucTotal = useMemo(() => state.vendas.reduce((acc, v) => acc + (Number(v.lucro) || 0), 0), [state.vendas]);
            const gastosTotal = state.gastos.reduce((acc, g) => acc + (Number(g.valor) || 0), 0);
            const saldoCaixa = lucTotal - gastosTotal;
            const cobertura = gastosTotal > 0 ? (lucTotal / gastosTotal) * 100 : 100;

            const simulacao = useMemo(() => {
                if (!state.estoque.length) return null;
                let cMat = 0; let pTotal = 0;
                calcForm.filamentos.forEach(f => {
                    const mat = state.estoque[f.matIdx] || state.estoque[0];
                    cMat += (Number(f.peso) / 1000) * Number(mat.preco);
                    pTotal += Number(f.peso);
                });
                const cLuz = (Number(state.settings.potencia) / 1000) * Number(calcForm.tempo) * Number(state.settings.kwh);
                const cAmort = (Number(state.settings.precoMaq) / Number(state.settings.vidaUtil) / 30 / 24) * Number(calcForm.tempo);
                const tFixo = Number(state.settings.aluguel) + Number(state.settings.softwares) + Number(state.settings.ecommerce) + Number(state.settings.mei) + Number(state.settings.publicidade) + Number(state.settings.condominio);
                const divisor = (Number(state.settings.FatPrevisto) || 4000);
                const cFixoProp = (tFixo / divisor) * Number(calcForm.tempo);
                const base = cMat + cLuz + cAmort + cFixoProp + Number(state.settings.embalagem);
                let cPint = 0;
                if(calcForm.pintura === "simples") cPint = Number(state.settings.pintSimples);
                else if(calcForm.pintura === "media") cPint = Number(state.settings.pintMedia);
                else if(calcForm.pintura === "profissional") cPint = Number(state.settings.pintProf);
                const sug = (base + cPint) * Number(state.settings.markup);
                return { custoBase: base, sugerido: sug, lucro: sug - (base + cPint), pesoTotal: pTotal };
            }, [calcForm, state.settings, state.estoque]);

            const apiCall = async (type, data) => {
                notify("A Processar...");
                if (type === 'delete_gasto') {
                    setState(p => ({ ...p, gastos: p.gastos.filter(g => String(g.id).trim() !== String(data.id).trim()) }));
                }
                const params = new URLSearchParams();
                params.append('type', type);
                Object.keys(data).forEach(k => { 
                    if(data[k] !== undefined && data[k] !== null) params.append(k, String(data[k]).trim()); 
                });
                try {
                    await fetch(`${state.settings.urlWrite}?${params.toString()}`, { method: 'GET', mode: 'no-cors' });
                    setTimeout(sync, 2500); 
                    notify("Operação Concluída");
                    return true;
                } catch (e) { 
                    notify("Sincronização pendente..."); 
                    return false; 
                }
            };

            const updateFilamentSlot = (idx, field, value) => {
                setCalcForm(prev => ({
                    ...prev,
                    filamentos: prev.filamentos.map((f, i) => i === idx ? { ...f, [field]: value } : f)
                }));
            };

            const navigationItems = [
                {id: 'calc', l: 'Calculadora', i: 'calc'},
                {id: 'sales', l: 'Vendas', i: 'sales'},
                {id: 'expenses', l: 'Despesas', i: 'wallet'},
                {id: 'stock', l: 'Estoque', i: 'stock'},
                {id: 'settings', l: 'Ajustes', i: 'settings'}
            ];

            return (
                <div className="flex flex-col min-h-screen bg-slate-50">
                    <header className="w-full bg-white border-b border-slate-200 sticky top-0 z-40 px-6 py-4 shadow-sm">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="font-black text-3xl tracking-tighter text-slate-900 italic">333</div>
                                <div className="hidden sm:block leading-tight"><span className="font-extrabold text-[10px] text-slate-400 uppercase tracking-widest">Print Studio</span></div>
                            </div>
                            <nav className="hidden md:flex items-center gap-1">
                                {navigationItems.map(item => (
                                    <button key={item.id} onClick={() => setPage(item.id)} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${page===item.id ? 'bg-amber-100 text-amber-900 shadow-sm' : 'text-slate-400 hover:bg-slate-100 hover:text-slate-600'}`}>
                                        {item.l}

                        {page === 'settings' && (
                            <div className="max-w-4xl space-y-10 animate-in slide-in-from-bottom">
                                <h2 className="text-3xl font-bold tracking-tight">Parâmetros</h2>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                    {Object.keys(state.settings).filter(k => typeof state.settings[k] === 'number').map(key => (
                                        <div key={key} className="bg-white p-6 rounded-[24px] shadow-sm border border-slate-100 space-y-1 hover:shadow-md transition-shadow">
                                            <label className="text-[9px] font-black text-slate-300 uppercase tracking-widest ml-1">{key}</label>
                                            <input type="number" value={state.settings[key]} onChange={e => setState({...state, settings: {...state.settings, [key]: parseFloat(e.target.value)}})} className="w-full border-none bg-transparent p-0 font-black text-slate-800 text-xl focus:ring-0" />
                                        </div>
                                    ))}
                                </div>
                                <div className="bg-white p-10 rounded-[32px] shadow-2xl border border-slate-100 space-y-6">
                                    <div className="space-y-2"><label className="text-[10px] font-black text-blue-500 uppercase tracking-widest ml-1">Google Webhook URL</label><input type="text" value={state.settings.urlWrite} onChange={e => setState({...state, settings: {...state.settings, urlWrite: e.target.value}})} className="studio-input !bg-slate-50 !border-slate-100 font-mono text-[10px] text-slate-400 focus:text-slate-800" /></div>
                                    <button onClick={saveSettingsToCloud} className="w-full bg-slate-900 hover:bg-slate-800 text-white p-6 rounded-2xl font-black text-xs uppercase tracking-[0.2em] shadow-xl transition-all active:scale-[0.98]">Guardar na Nuvem</button>
                                </div>
                            </div>
                        )}
                    </main>

                    {toast.show && (
                        <div className="fixed bottom-28 md:bottom-12 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-5 rounded-[24px] shadow-2xl z-[1000] font-black text-[11px] uppercase tracking-widest flex items-center gap-4 border border-slate-700 animate-in slide-in-from-bottom duration-300">
                            <div className="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></div>
                            {toast.msg}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

if ("serviceWorker" in navigator) {
