<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Precificação 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; background:#111; color:#fff; padding:20px }
    button { padding:10px; margin-top:10px; width:100% }
    input { padding:10px; margin-top:5px; width:100% }
    .box { background:#1e1e1e; padding:15px; border-radius:10px; max-width:400px }
    ul { padding-left:15px }
  </style>
</head>
<body>

<h1>Estoque de Filamentos</h1>

<div class="box">
  <h2>Cadastrar Filamento</h2>

  <input id="nomeFil" placeholder="Nome do filamento">
  <input id="precoFil" type="number" placeholder="Preço por grama">
  <input id="saldoFil" type="number" placeholder="Saldo (g)">

  <button id="btnAdd">Adicionar Filamento</button>
</div>

<div class="box" style="margin-top:20px">
  <h2>Estoque Atual</h2>
  <button id="btnLoad">Atualizar Lista</button>
  <ul id="listaEstoque"></ul>
</div>

<script src="app.js"></script>
</body>
</html>
