<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Forja 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f1f5f9; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid #334155; border-radius: 16px; margin-bottom: 20px; }
        input, select { background: #1e293b; border: 1px solid #475569; color: white; padding: 10px; border-radius: 8px; width: 100%; }
        .btn { padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; transition: 0.2s; }
        .btn-blue { background: #3b82f6; }
        .btn-red { background: #ef4444; margin-top: 10px; }
        .tab-btn { padding: 10px; width: 50%; border-bottom: 2px solid transparent; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto pb-24">

    <nav class="flex mb-6 border-b border-slate-700">
        <button id="btnTab1" onclick="switchTab(1)" class="tab-btn tab-active">Calculadora</button>
        <button id="btnTab2" onclick="switchTab(2)" class="tab-btn">Almoxarifado</button>
    </nav>

    <div id="tab1">
        <div class="glass-card p-4">
            <h2 class="text-blue-300 font-semibold mb-3">📦 Estoque Atual</h2>
            <div id="tabelaEstoque" class="text-xs space-y-2">Carregando...</div>
        </div>
        <div class="glass-card p-6">
            <h2 class="text-green-300 font-semibold mb-4">🔮 Nova Encomenda</h2>
            <div class="space-y-4">
                <select id="selMaterial" onchange="calcularTudo()"></select>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="pesoPeca" placeholder="Peso (g)" oninput="calcularTudo()">
                    <input type="number" id="tempoHoras" placeholder="Tempo (h)" oninput="calcularTudo()">
                </div>
                <select id="selMkt" onchange="calcularTudo()">
                    <option value="direta">Venda Direta</option>
                    <option value="ml">Mercado Livre</option>
                    <option value="shopee">Shopee</option>
                </select>
            </div>
            <div class="mt-6 p-4 bg-slate-900/50 rounded-xl border border-blue-500/30 text-center">
                <span class="text-blue-400 block text-sm">Preço Sugerido:</span>
                <span id="resVenda" class="text-green-400 text-2xl font-bold">R$ 0,00</span>
            </div>
            <button onclick="enviarPedido()" class="btn btn-blue mt-6">REGISTRAR PEDIDO</button>
        </div>
    </div>

    <div id="tab2" class="hidden">
        <div class="glass-card p-6">
            <h2 class="text-yellow-300 font-semibold mb-4">🛠️ Gerenciar Filamento</h2>
            <div class="space-y-4">
                <input type="text" id="mNome" placeholder="Nome do Material (Ex: PLA Azul)">
                <input type="number" id="mPreco" placeholder="Preço do Rolo (R$)">
                <input type="number" id="mPeso" placeholder="Peso Total do Rolo (g)">
                <div id="areaEditar" class="hidden">
                    <input type="number" id="mPesoAtual" placeholder="Peso Atual em Estoque (g)">
                </div>
            </div>
            <button id="btnMAdd" onclick="gerenciarMaterial('ADICIONAR')" class="btn btn-blue mt-6">ADICIONAR NOVO</button>
            <div id="botoesEdicao" class="hidden">
                <button onclick="gerenciarMaterial('EDITAR')" class="btn btn-blue mt-4">SALVAR ALTERAÇÕES</button>
                <button onclick="gerenciarMaterial('DELETAR')" class="btn btn-red">EXCLUIR FILAMENTO</button>
            </div>
            <p class="text-[10px] text-slate-500 mt-4 italic text-center">Para editar, clique em um material na lista da aba Calculadora.</p>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "SUA_URL_DO_SCRIPT_AQUI"; // COLOQUE SUA URL AQUI
        let estoqueLocal = [];
        let materialEmEdicao = null;

        function switchTab(tab) {
            document.getElementById('tab1').classList.toggle('hidden', tab !== 1);
            document.getElementById('tab2').classList.toggle('hidden', tab !== 2);
            document.getElementById('btnTab1').classList.toggle('tab-active', tab === 1);
            document.getElementById('btnTab2').classList.toggle('tab-active', tab === 2);
        }

        async function carregar() {
            const res = await fetch(SCRIPT_URL);
            estoqueLocal = await res.json();
            let htmlE = "", htmlS = "";
            for(let i=1; i<estoqueLocal.length; i++) {
                const [n, p, pt, pa] = estoqueLocal[i];
                htmlE += `<div onclick="prepararEdicao(${i})" class="flex justify-between border-b border-slate-700 py-1 cursor-pointer"><span>${n}</span><span>${pa}g</span></div>`;
                htmlS += `<option value="${p}">${n}</option>`;
            }
            document.getElementById('tabelaEstoque').innerHTML = htmlE;
            document.getElementById('selMaterial').innerHTML = htmlS;
        }

        function prepararEdicao(index) {
            const [n, p, pt, pa] = estoqueLocal[index];
            materialEmEdicao = n;
            document.getElementById('mNome').value = n;
            document.getElementById('mPreco').value = p;
            document.getElementById('mPeso').value = pt;
            document.getElementById('mPesoAtual').value = pa;
            
            document.getElementById('areaEditar').classList.remove('hidden');
            document.getElementById('botoesEdicao').classList.remove('hidden');
            document.getElementById('btnMAdd').classList.add('hidden');
            switchTab(2);
        }

        async function gerenciarMaterial(acao) {
            const payload = {
                acao: acao,
                nome: document.getElementById('mNome').value,
                nomeAntigo: materialEmEdicao,
                preco: document.getElementById('mPreco').value,
                pesoTotal: document.getElementById('mPeso').value,
                pesoAtual: document.getElementById('mPesoAtual').value
            };
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            alert("Operação realizada!");
            location.reload();
        }

        function calcularTudo() {
            const pKg = parseFloat(document.getElementById('selMaterial').value) || 0;
            const pG = parseFloat(document.getElementById('pesoPeca').value) || 0;
            const tH = parseFloat(document.getElementById('tempoHoras').value) || 0;
            const mkt = document.getElementById('selMkt').value;
            const custo = (pG/1000 * pKg) + (150/1000 * tH * 0.85) + (2000/5000 * tH);
            let preco = custo * 2;
            if(mkt==='ml') preco = (preco+6)/0.83;
            if(mkt==='shopee') preco = preco/0.80;
            document.getElementById('resVenda').innerText = "R$ " + preco.toFixed(2);
        }

        async function enviarPedido() {
            const sel = document.getElementById('selMaterial');
            const payload = {
                acao: "PEDIDO",
                material: sel.options[sel.selectedIndex].text,
                pesoGasto: parseFloat(document.getElementById('pesoPeca').value),
                custo: "R$ " + (parseFloat(document.getElementById('resVenda').innerText.replace('R$ ',''))/2).toFixed(2),
                precoVenda: document.getElementById('resVenda').innerText,
                mkt: document.getElementById('selMkt').value
            };
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            alert("Pedido e estoque atualizados!");
            location.reload();
        }

        window.onload = carregar;
    </script>
</body>
</html>
