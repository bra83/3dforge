<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precificação 3D</title>
</head>
<body>

<h2>Precificação 3D</h2>

<label>Filamento</label>
<select id="filamento"></select>

<label>Peso (g)</label>
<input type="number" id="peso">

<label>Tempo (h)</label>
<input type="number" id="tempo">

<button onclick="calcular()">Calcular</button>

<h3 id="resultado"></h3>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycby4SPov2vVUGhoSAoQ4juRakKstF8hgoUuDVzsQD-28Fc394F_aSqfVCe5jTqMjtQfT/exec";

  async function carregarFilamentos() {
    const r = await fetch(API_URL + "?action=estoque");
    const data = await r.json();

    const sel = document.getElementById("filamento");
    sel.innerHTML = "";

    data.forEach(f => {
      sel.innerHTML += `<option value="${f[2]}">${f[1]} (${f[3]} g)</option>`;
    });
  }

  function calcular() {
    const precoG = Number(filamento.value);
    const peso = Number(document.getElementById("peso").value);
    const tempo = Number(document.getElementById("tempo").value);

    const custoMaterial = precoG * peso;
    const custoMaquina = tempo * 0.73;
    const custoTotal = custoMaterial + custoMaquina;

    document.getElementById("resultado").innerText =
      "Custo estimado: R$ " + custoTotal.toFixed(2);
  }

  carregarFilamentos();
</script>

</body>
</html>
