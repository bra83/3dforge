<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <link rel="manifest" href="manifest.json">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>333 Print Studio - Gestão Pro</title>
    
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@900&display=swap');
        
        :root {
            --studio-white: #ffffff;
            --studio-ice: #f8fafc;
            --studio-yellow: #fffbeb; 
            --studio-amber: #fef3c7; 
            --studio-border: #f1f5f9;
            --studio-accent: #3b82f6;
            --studio-text: #0f172a;
            --studio-muted: #64748b;
            --whatsapp-green: #25D366;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--studio-white); 
            color: var(--studio-text);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .logo-333 {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            letter-spacing: -0.22em; 
            font-size: 2.2rem;
            line-height: 1;
            color: var(--studio-text);
            display: inline-block;
            transform: scaleY(1.15);
        }

        .clean-card {
            background: #ffffff;
            border: 1px solid var(--studio-border);
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.01);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .studio-input {
            background: var(--studio-yellow) !important;
            border: 1.5px solid #fde68a !important;
            border-radius: 12px;
            padding: 0.8rem 1rem;
            width: 100%;
            font-size: 14px;
            font-weight: 600;
            color: var(--studio-text);
            outline: none;
            transition: all 0.2s;
        }

        .studio-input:focus {
            border-color: #fbbf24 !important;
            background: white !important;
            box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.15);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 800;
            color: var(--studio-muted);
            transition: all 0.2s;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        @media (min-width: 768px) {
            .nav-item { flex-direction: row; font-size: 12px; padding: 10px 18px; gap: 8px; }
        }

        .nav-item.active {
            background: var(--studio-yellow);
            color: var(--studio-text);
            box-shadow: inset 0 0 0 1px #fde68a;
        }

        .btn-studio-black {
            background: var(--studio-text);
            color: white;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 12px;
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-studio-whatsapp {
            background: var(--whatsapp-green);
            color: white;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 11px;
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-studio-black:active, .btn-studio-whatsapp:active { transform: scale(0.97); opacity: 0.9; }

        .progress-bar-brilliant {
            transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.5s ease;
            height: 100%;
            border-radius: 9999px;
            position: relative;
        }

        .custom-scrollbar::-webkit-scrollbar { height: 4px; width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--studio-border); border-radius: 10px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .anim-fade { animation: fadeIn 0.4s ease forwards; }

        .mobile-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid var(--studio-border);
            display: flex;
            justify-content: space-around;
            padding: 10px 4px;
            padding-bottom: env(safe-area-inset-bottom, 10px);
            z-index: 50;
        }
    </style>
</head>
<body class="pb-24 md:pb-0">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, Fragment } = React;

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                calc: <path d="M16 2H8a2 2 0 00-2 2v16a2 2 0 002 2h8a2 2 0 002-2V4a2 2 0 00-2-2zM8 6h8M8 10h8M8 14h8M8 18h8" />,
                stock: <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />,
                sales: (
                    <Fragment>
                        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" />
                        <path d="M3 6h18M16 10a4 4 0 01-8 0" />
                    </Fragment>
                ),
                settings: (
                    <Fragment>
                        <circle cx="12" cy="12" r="3" />
                        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" />
                    </Fragment>
                ),
                whatsapp: <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 1 1-7.6-7.6 8.38 8.38 0 0 1 3.8.9L21 4.5z" />,
                trash: <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" />,
                edit: <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 113 3L12 15l-4 1 1-4 9.5-9.5z" />,
                refresh: <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />,
                check: <path d="M20 6L9 17l-5-5" />
            };
            return <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">{icons[name] || null}</svg>;
        };

        const App = () => {
            const [page, setPage] = useState('calc');
            const [state, setState] = useState({
                estoque: [],
                vendas: [],
                syncing: false,
                settings: JSON.parse(localStorage.getItem('333_vFINAL_stable')) || {
                    aluguel: 210, softwares: 95, ecommerce: 59.9, mei: 60, publicidade: 100, condominio: 100,
                    kwh: 1.14, potencia: 350, precoMaq: 1500, vidaUtil: 24, 
                    fatPrevisto: 4000, embalagem: 3, markup: 2.5, meta: 6600,
                    pintSimples: 15, pintMedia: 35, pintProf: 60,
                    urlWrite: "https://script.google.com/macros/s/AKfycbzJVgbVULF0NArQCZI7KUWoh8c1fy8qxEpEh5NHFHWfuRqR5NDl4VxRjsCWbMraK0SKhQ/exec"
                }
            });

            const [calcForm, setCalcForm] = useState({ nome: '', tempo: 10, peso: 100, matIdx: 0, pintura: 'media', whatsapp: '' });
            const [matForm, setMatForm] = useState({ nome: '', peso: 1000, preco: 120, editing: false, oldName: '' });
            const [toast, setToast] = useState({ show: false, msg: '' });

            const notify = (msg) => {
                setToast({ show: true, msg });
                setTimeout(() => setToast({ show: false, msg: '' }), 4000);
            };

            const sync = async () => {
                setState(prev => ({ ...prev, syncing: true }));
                try {
                    const response = await fetch(`${state.settings.urlWrite}?type=read_data&nocache=${Date.now()}`);
                    const data = await response.json();
                    
                    const safeEstoque = (data.estoque || []).map(item => ({
                        ...item, peso: Number(item.peso) || 0, preco: Number(item.preco) || 0
                    }));
                    const safeVendas = (data.vendas || []).map(v => ({
                        ...v, venda: Number(v.venda) || 0, lucro: Number(v.lucro) || 0
                    }));

                    setState(prev => ({ ...prev, estoque: safeEstoque, vendas: safeVendas, syncing: false }));
                    notify("Banco Sincronizado");
                } catch (e) { 
                    setState(prev => ({ ...prev, syncing: false })); 
                    notify("Erro na ligação à Planilha"); 
                }
            };

            useEffect(() => { sync(); }, []);

            const getColorFromName = (name) => {
                const match = String(name).match(/"([^"]+)"/);
                return match ? match[1] : '#22c55e';
            };

            const fatTotal = useMemo(() => state.vendas.reduce((acc, v) => acc + (Number(v.venda) || 0), 0), [state.vendas]);
            const lucTotal = useMemo(() => state.vendas.reduce((acc, v) => acc + (Number(v.lucro) || 0), 0), [state.vendas]);

            const simulacao = useMemo(() => {
                if (!state.estoque.length) return null;
                const mat = state.estoque[calcForm.matIdx] || state.estoque[0];
                const cMat = (Number(calcForm.peso) / 1000) * Number(mat.preco);
                const cLuz = (Number(state.settings.potencia) / 1000) * Number(calcForm.tempo) * Number(state.settings.kwh);
                const cAmort = (Number(state.settings.precoMaq) / Number(state.settings.vidaUtil) / 30 / 24) * Number(calcForm.tempo);
                const tFixoTotal = Number(state.settings.aluguel) + Number(state.settings.softwares) + Number(state.settings.ecommerce) + Number(state.settings.mei) + Number(state.settings.publicidade) + Number(state.settings.condominio);
                const cFixoProp = (tFixoTotal / 4000) * Number(calcForm.tempo);
                const custoBaseReal = cMat + cLuz + cAmort + cFixoProp + Number(state.settings.embalagem);
                let cPint = 0;
                if(calcForm.pintura === "simples") cPint = Number(state.settings.pintSimples);
                else if(calcForm.pintura === "media") cPint = Number(state.settings.pintMedia);
                else if(calcForm.pintura === "profissional") cPint = Number(state.settings.pintProf);

                const sugerido = (custoBaseReal + cPint) * Number(state.settings.markup);
                return { custoBase: custoBaseReal, sugerido, lucro: sugerido - (custoBaseReal + cPint) };
            }, [calcForm, state.settings, state.estoque]);

            const sendWhatsApp = () => {
                if (!simulacao) return;
                const valor = simulacao.sugerido.toFixed(2);
                const msg = `Olá! Segue o orçamento para o projeto: *${calcForm.nome || 'Impressão 3D'}*%0A%0A*Tempo estimado:* ${calcForm.tempo}h%0A*Valor Total:* R$ ${valor}%0A%0A_Enviado via 333 Print Studio_`;
                const phone = calcForm.whatsapp.replace(/\D/g, '');
                window.open(`https://wa.me/${phone ? '55' + phone : ''}?text=${msg}`, '_blank');
            };

            const apiCall = async (type, data) => {
                notify("Sincronizando...");
                const payload = { 
                    type, data: new Date().toLocaleDateString('pt-BR'),
                    nome: data.nome, peso: data.peso, preco: data.preco, oldName: data.oldName,
                    item: data.item, material: data.material, venda: data.venda, lucro: data.lucro
                };
                const q = new URLSearchParams();
                Object.keys(payload).forEach(key => { if (payload[key] !== undefined) q.append(key, payload[key]); });
                
                try {
                    if (type === 'venda') {
                        setState(p => ({ 
                            ...p, 
                            vendas: [{ data: payload.data, item: data.item, venda: parseFloat(data.venda), lucro: parseFloat(data.lucro) }, ...p.vendas],
                            estoque: p.estoque.map(m => m.nome.trim().toLowerCase() === data.material.trim().toLowerCase() ? {...m, peso: m.peso - data.peso} : m)
                        }));
                    }
                    await fetch(`${state.settings.urlWrite}?${q.toString()}`, { method: 'GET', mode: 'no-cors' });
                    setTimeout(sync, 2500); 
                    notify("Operação Concluída");
                    return true;
                } catch (e) { notify("Erro de Rede"); return false; }
            };

            const navigationItems = [
                {id: 'calc', l: 'Calculadora', i: 'calc'},
                {id: 'sales', l: 'Vendas', i: 'sales'},
                {id: 'stock', l: 'Estoque', i: 'stock'},
                {id: 'settings', l: 'Ajustes', i: 'settings'}
            ];

            return (
                <div className="flex flex-col min-h-screen bg-white">
                    
                    <header className="w-full bg-white border-b border-slate-100 sticky top-0 z-40 px-6 py-4">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="logo-333">333</div>
                                <div className="h-6 w-px bg-slate-100 hidden md:block"></div>
                                <div className="hidden sm:block">
                                    <span className="font-extrabold text-[10px] text-slate-400 uppercase tracking-[0.2em] leading-tight">Print<br/>Studio</span>
                                </div>
                            </div>

                            <nav className="hidden md:flex items-center gap-1">
                                {navigationItems.map(item => (
                                    <div key={item.id} onClick={() => setPage(item.id)} 
                                         className={`nav-item ${page===item.id ? 'active' : ''}`}>
                                        <Icon name={item.i} /> {item.l}
                                    </div>
                                ))}
                            </nav>

                            <div className="flex items-center gap-4">
                                <div className={`w-2 h-2 rounded-full ${state.syncing ? 'bg-blue-500 animate-pulse' : 'bg-emerald-500'}`}></div>
                                <button onClick={sync} className="text-slate-300 hover:text-slate-900 transition-colors"><Icon name="refresh" className="w-5 h-5"/></button>
                            </div>
                        </div>
                    </header>

                    <nav className="md:hidden mobile-nav">
                        {navigationItems.map(item => (
                            <div key={item.id} onClick={() => setPage(item.id)} 
                                 className={`nav-item ${page===item.id ? 'active' : ''} flex-1`}>
                                <Icon name={item.i} className="w-6 h-6" />
                                <span className="text-[9px] font-black">{item.l}</span>
                            </div>
                        ))}
                    </nav>

                    <main className="flex-1 p-5 md:p-10 lg:p-14 max-w-7xl mx-auto w-full anim-fade">
                        
                        {page === 'calc' && (
                            <div className="grid grid-cols-1 xl:grid-cols-2 gap-8 lg:gap-14">
                                <section className="space-y-8">
                                    <div>
                                        <h2 className="text-[10px] font-black text-amber-500 uppercase tracking-[0.3em] mb-2">Simulação</h2>
                                        <p className="text-2xl font-bold text-slate-900">Novo Orçamento</p>
                                    </div>
                                    <div className="clean-card p-6 md:p-8 space-y-6">
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black text-slate-400 uppercase">Projeto</label>
                                            <input type="text" value={calcForm.nome} onChange={e => setCalcForm(p => ({...p, nome: e.target.value}))} className="studio-input" placeholder="Ex: Diorama Batman" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black text-slate-400 uppercase">Tempo (h)</label>
                                                <input type="number" value={calcForm.tempo} onChange={e => setCalcForm(p => ({...p, tempo: parseFloat(e.target.value)}))} className="studio-input" />
                                            </div>
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black text-slate-400 uppercase">Massa (g)</label>
                                                <input type="number" value={calcForm.peso} onChange={e => setCalcForm(p => ({...p, peso: parseFloat(e.target.value)}))} className="studio-input" />
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black text-slate-400 uppercase">Filamento</label>
                                                <select value={calcForm.matIdx} onChange={e => setCalcForm(p => ({...p, matIdx: e.target.value}))} className="studio-input appearance-none">
                                                    {state.estoque.map((m, i) => <option key={i} value={i}>{m.nome}</option>)}
                                                </select>
                                            </div>
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black text-slate-400 uppercase">Acabamento</label>
                                                <select value={calcForm.pintura} onChange={e => setCalcForm(p => ({...p, pintura: e.target.value}))} className="studio-input appearance-none">
                                                    <option value="none">Cru</option><option value="simples">Simples</option><option value="media">Média</option><option value="profissional">Profissional</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="pt-6 border-t border-slate-100 space-y-4">
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black text-slate-400 uppercase">WhatsApp do Cliente (Opcional)</label>
                                                <input type="text" value={calcForm.whatsapp} onChange={e => setCalcForm(p => ({...p, whatsapp: e.target.value}))} className="studio-input" placeholder="DDD + Número" />
                                            </div>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                <button onClick={sendWhatsApp} className="btn-studio-whatsapp shadow-lg shadow-emerald-50">
                                                    <Icon name="whatsapp" /> Enviar Orçamento
                                                </button>
                                                <button onClick={() => apiCall('venda', {
                                                    item: calcForm.nome || "Item Studio",
                                                    material: state.estoque[calcForm.matIdx]?.nome,
                                                    peso: calcForm.peso, venda: simulacao?.sugerido.toFixed(2), lucro: simulacao?.lucro.toFixed(2)
                                                })} className="btn-studio-black shadow-lg shadow-slate-100">
                                                    <Icon name="check" /> Concretizar Venda
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </section>

                                <section className="space-y-6">
                                    <div className="clean-card p-8 md:p-10 space-y-10 border-t-4 border-t-amber-400 shadow-xl">
                                        <div className="flex justify-between items-center bg-amber-50/50 p-5 rounded-xl border border-amber-100">
                                            <span className="text-[10px] font-black text-amber-600 uppercase tracking-widest">Custo Real</span>
                                            <span className="text-lg font-bold text-amber-700">R$ {simulacao?.custoBase.toFixed(2)}</span>
                                        </div>
                                        <div className="text-center space-y-10">
                                            <div>
                                                <p className="text-[10px] font-black text-slate-300 uppercase tracking-[0.4em] mb-4">Venda Sugerida</p>
                                                <p className="text-5xl md:text-6xl font-black text-slate-900 tracking-tighter italic">R$ {simulacao?.sugerido.toFixed(2)}</p>
                                            </div>
                                            <div>
                                                <p className="text-[10px] font-black text-slate-300 uppercase tracking-[0.4em] mb-4">Lucro Líquido</p>
                                                <p className="text-5xl md:text-6xl font-black text-blue-600 tracking-tighter italic">R$ {simulacao?.lucro.toFixed(2)}</p>
                                            </div>
                                        </div>
                                    </div>
                                </section>
                            </div>
                        )}

                        {page === 'sales' && (
                            <div className="space-y-10">
                                <header>
                                    <h2 className="text-[10px] font-black text-blue-500 uppercase tracking-[0.3em] mb-2">Financeiro</h2>
                                    <p className="text-2xl font-bold text-slate-900 italic underline decoration-blue-500 decoration-4 underline-offset-8">Relatório de Resultados</p>
                                </header>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="clean-card p-8 text-center bg-slate-50/50">
                                        <span className="text-[10px] font-black text-slate-400 uppercase block mb-2">Receita Total</span>
                                        <span className="text-3xl font-black text-slate-900">R$ {fatTotal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</span>
                                    </div>
                                    <div className="clean-card p-8 text-center border-l-4 border-l-emerald-500 bg-emerald-50/20">
                                        <span className="text-[10px] font-black text-emerald-600/60 uppercase block mb-2">Lucro Real</span>
                                        <span className="text-3xl font-black text-emerald-600">R$ {lucTotal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</span>
                                    </div>
                                </div>
                                <div className="clean-card overflow-hidden">
                                    <div className="overflow-x-auto custom-scrollbar">
                                        <table className="w-full text-left text-sm whitespace-nowrap">
                                            <thead className="bg-slate-50 text-[10px] font-black text-slate-400 uppercase">
                                                <tr><th className="p-5">Data</th><th className="p-5">Item</th><th className="p-5 text-right">Preço</th><th className="p-5 text-right">Lucro</th></tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-50">
                                                {state.vendas.slice().reverse().map((v, i) => (
                                                    <tr key={i} className="hover:bg-slate-50/50 transition-all">
                                                        <td className="p-5 text-slate-400 font-medium">{v.data}</td>
                                                        <td className="p-5 font-bold text-slate-800 uppercase tracking-tighter">{v.item}</td>
                                                        <td className="p-5 text-right font-mono text-slate-400">R$ {Number(v.venda).toFixed(2)}</td>
                                                        <td className="p-5 text-right text-emerald-500 font-black font-mono">R$ {Number(v.lucro).toFixed(2)}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {page === 'stock' && (
                            <div className="space-y-12">
                                <header>
                                    <h2 className="text-[10px] font-black text-emerald-500 uppercase tracking-[0.3em] mb-2">Supply</h2>
                                    <p className="text-2xl font-bold text-slate-900 italic underline decoration-emerald-500 decoration-4 underline-offset-8">Inventário de Filamentos</p>
                                </header>
                                <div className="clean-card p-6 md:p-8 bg-amber-50/20 border-amber-100">
                                    <h3 className="text-[10px] font-black uppercase text-amber-600 mb-6 flex items-center gap-2"><Icon name={matForm.editing ? 'edit' : 'plus'} className="w-3 h-3"/> {matForm.editing ? 'Editar Registro' : 'Novo Material'}</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-5 items-end">
                                        <div><label className="text-[10px] font-black text-slate-400 uppercase ml-1">Descrição</label><input type="text" value={matForm.nome} onChange={e => setMatForm(p => ({...p, nome: e.target.value}))} className="studio-input" placeholder='PLA "Red"' /></div>
                                        <div><label className="text-[10px] font-black text-slate-400 uppercase ml-1">Peso (g)</label><input type="number" value={matForm.peso} onChange={e => setMatForm(p => ({...p, peso: parseFloat(e.target.value)}))} className="studio-input" /></div>
                                        <div><label className="text-[10px] font-black text-slate-400 uppercase ml-1">Preço R$</label><input type="number" value={matForm.preco} onChange={e => setMatForm(p => ({...p, preco: parseFloat(e.target.value)}))} className="studio-input" /></div>
                                        <div className="md:col-span-3">
                                            <button onClick={() => {
                                                const type = matForm.editing ? 'edit_estoque' : 'estoque';
                                                apiCall(type, matForm);
                                                setMatForm({nome:'', peso:1000, preco:120, editing:false, oldName:''});
                                            }} className="w-full btn-studio-black shadow-amber-100 shadow-lg">{matForm.editing ? 'Confirmar Edição' : 'Lançar Filamento'}</button>
                                        </div>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 gap-8">
                                    {state.estoque.map((m, i) => {
                                        const p = Math.max(0, Math.min(100, (Number(m.peso) / 1000) * 100));
                                        const barColor = getColorFromName(m.nome);
                                        return (
                                            <div key={i} className="clean-card p-6 md:p-8 space-y-6">
                                                <div className="flex flex-col md:flex-row md:items-center justify-between gap-6">
                                                    <div className="flex-1">
                                                        <div className="flex justify-between items-end mb-4">
                                                            <span className="font-extrabold text-slate-900 uppercase tracking-tighter text-lg">{m.nome}</span>
                                                            <span className="font-mono text-[10px] text-slate-400">{Number(m.peso).toFixed(0)}g / 1000g</span>
                                                        </div>
                                                        <div className="w-full bg-slate-100 h-2 rounded-full relative">
                                                            <div className="progress-bar-brilliant absolute left-0 top-0" 
                                                                 style={{ 
                                                                     width: `${p}%`, 
                                                                     backgroundColor: barColor,
                                                                     boxShadow: `0 0 20px ${barColor}77, 0 0 8px ${barColor}44` 
                                                                 }}></div>
                                                        </div>
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button onClick={() => setMatForm({...m, editing: true, oldName: m.nome})} className="p-3 bg-slate-50 hover:bg-amber-50 text-slate-300 hover:text-amber-600 rounded-xl transition-all border border-transparent hover:border-amber-100"><Icon name="edit" /></button>
                                                        <button onClick={() => apiCall('delete_estoque', { nome: m.nome })} className="p-3 bg-slate-50 hover:bg-rose-50 text-slate-300 hover:text-rose-500 rounded-xl transition-all border border-transparent hover:border-rose-100"><Icon name="trash" /></button>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {page === 'settings' && (
                            <div className="max-w-3xl space-y-12">
                                <header>
                                    <h2 className="text-[10px] font-black text-slate-300 uppercase tracking-[0.3em] mb-2">Sistema</h2>
                                    <p className="text-2xl font-bold text-slate-900">Configurações Studio</p>
                                </header>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                    {Object.keys(state.settings).filter(k => typeof state.settings[k] === 'number').map(key => (
                                        <div key={key} className="space-y-2">
                                            <label className="text-[10px] font-black text-slate-400 uppercase ml-1">{key}</label>
                                            <input type="number" value={state.settings[key]} onChange={e => setState(p => ({...p, settings: {...p.settings, [key]: parseFloat(e.target.value)}}))} className="studio-input font-bold" />
                                        </div>
                                    ))}
                                </div>
                                <div className="space-y-8 pt-8 border-t border-slate-100">
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black text-blue-500 uppercase tracking-widest">Script Webhook URL</label>
                                        <input type="text" value={state.settings.urlWrite} onChange={e => setState(p => ({...p, settings: {...p.settings, urlWrite: e.target.value}}))} className="studio-input font-mono text-[10px] opacity-60" />
                                    </div>
                                    <button onClick={() => { localStorage.setItem('333_vFINAL_stable', JSON.stringify(state.settings)); notify("Configurações Salvas"); }} className="btn-studio-black w-full">Salvar Parâmetros</button>
                                </div>
                            </div>
                        )}
                    </main>

                    {toast.show && (
                        <div className="fixed bottom-24 md:bottom-10 left-1/2 -translate-x-1/2 bg-slate-950 text-white px-8 py-4 rounded-2xl shadow-2xl z-[1000] font-black text-[10px] uppercase tracking-[0.3em] flex items-center gap-3 animate-fade border border-slate-800">
                            <div className="w-2 h-2 rounded-full bg-blue-500"></div> {toast.msg}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
