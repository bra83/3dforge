<!DOCTYPE html>
<html lang="pt-pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>333 Print Studio - Gestão Pro</title>

  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@900&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .logo-333 { font-family: 'Outfit', sans-serif; font-weight: 900; letter-spacing: -0.22em; font-size: 2.2rem; }
    .nav-item { cursor:pointer; padding:10px; font-weight:800; }
    .nav-item.active { background:#fffbeb; }
    .studio-input { padding:0.7rem; border:1px solid #fde68a; border-radius:10px; width:100%; }
    .btn-studio-black { background:#0f172a; color:white; padding:1rem; border-radius:12px; font-weight:800; }
  </style>
</head>

<body class="pb-24 md:pb-0">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, Fragment } = React;

const App = () => {
  const [page, setPage] = useState('calc');

  const [state, setState] = useState({
    estoque: [],
    vendas: [],
    gastos: [],
    syncing: false,
    settings: JSON.parse(localStorage.getItem('333_vFINAL_stable')) || {
      fatPrevisto: 4000,
      urlWrite: "https://script.google.com/macros/s/AKfycbzJVgbVULF0NArQCZI7KUWoh8c1fy8qxEpEh5NHFHWfuRqR5NDl4VxRjsCWbMraK0SKhQ/exec"
    }
  });

  const sync = async () => {
    setState(p => ({ ...p, syncing:true }));
    try {
      const r = await fetch(`${state.settings.urlWrite}?type=read_data&nocache=${Date.now()}`);
      const d = await r.json();

      setState(p => ({
        ...p,
        estoque: d.estoque || [],
        vendas: d.vendas || [],
        gastos: (d.gastos || []).map(g => ({ ...g, valor:Number(g.valor)||0 })),
        syncing:false
      }));
    } catch {
      setState(p => ({ ...p, syncing:false }));
    }
  };

  useEffect(() => { sync(); }, []);

  const debitoTotal = useMemo(
    () => state.gastos.reduce((a,g)=>a+g.valor,0),
    [state.gastos]
  );

  const fatTotal = useMemo(
    () => state.vendas.reduce((a,v)=>a+Number(v.venda||0),0),
    [state.vendas]
  );

  const debitoRestante = useMemo(() => {
    if(!state.settings.fatPrevisto) return debitoTotal;
    const abatido = debitoTotal * (fatTotal / state.settings.fatPrevisto);
    return Math.max(0, debitoTotal - abatido);
  }, [debitoTotal, fatTotal, state.settings.fatPrevisto]);

  const addGasto = async () => {
    const desc = document.getElementById("gdesc").value;
    const val = Number(document.getElementById("gval").value);
    if(!desc || !val) return;

    await fetch(`${state.settings.urlWrite}?type=add_gasto&descricao=${encodeURIComponent(desc)}&valor=${val}&data=${new Date().toLocaleDateString("pt-BR")}`, {
      mode:"no-cors"
    });
    setTimeout(sync,1500);
  };

  return (
    <div className="p-6 space-y-6">
      <header className="flex gap-4">
        {['calc','gastos'].map(p => (
          <div key={p}
            onClick={()=>setPage(p)}
            className={`nav-item ${page===p?'active':''}`}>
            {p.toUpperCase()}
          </div>
        ))}
      </header>

      {page==='gastos' && (
        <div className="space-y-4 max-w-md">
          <input id="gdesc" className="studio-input" placeholder="Descrição"/>
          <input id="gval" type="number" className="studio-input" placeholder="Valor"/>
          <button className="btn-studio-black w-full" onClick={addGasto}>
            Registrar Gasto
          </button>

          <div className="pt-4">
            <p><b>Débito total:</b> R$ {debitoTotal.toFixed(2)}</p>
            <p><b>Débito restante:</b> R$ {debitoRestante.toFixed(2)}</p>
          </div>
        </div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
