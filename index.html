<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D_TERMINAL_CORE_v3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon-green: #00ff41; --dark-bg: #0d0208; --panel-bg: #161b22; }
        body { background-color: var(--dark-bg); color: var(--neon-green); font-family: 'Fira Code', monospace; padding: 10px; }
        .card { background-color: var(--panel-bg); border: 1px solid var(--neon-green); border-radius: 4px; padding: 15px; margin-bottom: 15px; box-shadow: 0 0 10px rgba(0, 255, 65, 0.05); }
        input, select { background-color: #000; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 8px; width: 100%; margin-bottom: 8px; outline: none; font-size: 0.85rem; }
        .btn { padding: 12px; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; border: 1px solid var(--neon-green); transition: 0.2s; }
        .btn-main { background-color: var(--neon-green); color: #000; }
        .btn-main:hover { background-color: #000; color: var(--neon-green); }
        .tab-btn { padding: 8px; cursor: pointer; border: 1px solid #333; flex-grow: 1; text-align: center; font-size: 0.7rem; opacity: 0.6; }
        .active-tab { background-color: var(--neon-green); color: #000; font-weight: bold; opacity: 1; }
        .content-section { display: none; }
        .content-section.active { display: block; }
        label { font-size: 0.65rem; text-transform: uppercase; opacity: 0.7; display: block; margin-bottom: 2px; }
        .progress-bg { background-color: #333; height: 6px; border-radius: 3px; width: 100%; margin-top: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: var(--neon-green); transition: width 0.5s; }
    </style>
</head>
<body class="max-w-lg mx-auto">

    <header class="mb-4 text-center border-b border-green-900 pb-2">
        <h1 class="text-base font-bold tracking-widest">3D_LOGISTICS_CORE_v3.0</h1>
    </header>

    <nav class="flex gap-1 mb-4">
        <div id="btn-1" class="tab-btn active-tab" onclick="switchTab(1)">CALC</div>
        <div id="btn-2" class="tab-btn" onclick="switchTab(2)">ESTOQUE</div>
        <div id="btn-3" class="tab-btn" onclick="switchTab(3)">CONFIG</div>
    </nav>

    <div id="content-1" class="content-section active">
        <div class="card">
            <label>> MATERIAL_SELECIONADO</label>
            <select id="selectMaterial" onchange="calcular()"></select>
            
            <div class="grid grid-cols-2 gap-2">
                <div><label>> PESO_PEÇA (G)</label><input type="number" id="pesoPeca" oninput="calcular()" value="0"></div>
                <div><label>> TEMPO_IMP (H)</label><input type="number" id="tempoHoras" oninput="calcular()" value="0"></div>
            </div>

            <label>> CANAL_DE_SAÍDA</label>
            <select id="mkt" onchange="calcular()">
                <option value="direta">VENDA DIRETA / LOCAL</option>
                <option value="ml">MERCADO LIVRE (COMM+FIXO)</option>
                <option value="shopee">SHOPEE (COMISSÃO_BASE)</option>
            </select>

            <div class="p-3 bg-black border border-green-900 rounded mb-4 font-mono text-[0.65rem] space-y-1">
                <div class="flex justify-between"><span>MATERIA+PURGA:</span><span id="detMat">R$ 0,00</span></div>
                <div class="flex justify-between"><span>ENERGIA+DEPREC:</span><span id="detFix">R$ 0,00</span></div>
                <div class="flex justify-between"><span>MÃO_OBRA+EMBAL:</span><span id="detExtra">R$ 0,00</span></div>
                <div class="border-t border-green-900 mt-2 pt-2 text-xs flex justify-between font-bold">
                    <span>CUSTO_PROD:</span><span id="resCusto">R$ 0,00</span>
                </div>
                <div class="text-sm flex justify-between font-bold text-white bg-green-900/20 p-1">
                    <span>VALOR_FINAL:</span><span id="resVenda" class="text-green-400">R$ 0,00</span>
                </div>
            </div>
            <button class="btn btn-main" onclick="registrarPedido()">EXECUTAR_ORDEM_VENDA</button>
        </div>
    </div>

    <div id="content-2" class="content-section">
        <div class="card">
            <h2 class="mb-3 text-xs font-bold uppercase">> ENTRADA_DE_DADOS_FILAMENTO</h2>
            <input type="text" id="novoNome" placeholder="NOME/COR/MATERIAL">
            <input type="number" id="novoPreco" placeholder="VALOR_DO_ROLO (R$)">
            <input type="number" id="novoPeso" placeholder="PESO_BRUTO (G)">
            <button class="btn btn-main" onclick="adicionarFilamento()">SINCRONIZAR_DB</button>
        </div>
        <div class="card" id="listaEstoque">
            <p class="text-[0.6rem] opacity-50">SINCRONIZANDO_RECURSOS...</p>
        </div>
    </div>

    <div id="content-3" class="content-section">
        <div class="card">
            <h2 class="mb-4 text-xs font-bold uppercase">> CONFIGURAÇÃO_DE_MARGENS</h2>
            
            <label>MÃO_DE_OBRA (R$ POR HORA)</label>
            <input type="number" id="cfgMaoObra" value="15.00" oninput="calcular()">

            <label>CUSTO_MÉDIO_EMBALAGEM (R$)</label>
            <input type="number" id="cfgEmbalagem" value="5.00" oninput="calcular()">

            <label>TAXA_PURGA/SUPORTE (%)</label>
            <input type="number" id="cfgPurga" value="15" oninput="calcular()">

            <label>MARGEM_LUCRO_LÍQUIDO (%)</label>
            <input type="number" id="cfgLucroPerc" value="100" oninput="calcular()">

            <div class="grid grid-cols-2 gap-2 mt-2">
                <div><label>LUZ (R$/KWH)</label><input type="number" id="cfgKwh" value="0.85" oninput="calcular()"></div>
                <div><label>CONSUMO (W)</label><input type="number" id="cfgConsumo" value="150" oninput="calcular()"></div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div><label>VALOR_MÁQ (R$)</label><input type="number" id="cfgMaqVal" value="2000" oninput="calcular()"></div>
                <div><label>VIDA_ÚTIL (H)</label><input type="number" id="cfgVidaH" value="5000" oninput="calcular()"></div>
            </div>
        </div>
    </div>

    <script>
        // URL Sincronizada com seu Google Apps Script
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbws1Ltn_D-VG5s7utXwyBc1m5764U9naa26jo3tnR38UcEnq3270-0b6ttBlCVWr43m/exec"; 
        
        let dadosEstoque = [];

        function switchTab(n) {
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active-tab'));
            document.getElementById('content-' + n).classList.add('active');
            document.getElementById('btn-' + n).classList.add('active-tab');
        }

        async function carregarDados() {
            try {
                const resp = await fetch(URL_SCRIPT);
                dadosEstoque = await resp.json();
                atualizarUI();
            } catch (e) { console.error("Falha ao ler banco de dados."); }
        }

        function atualizarUI() {
            const select = document.getElementById('selectMaterial');
            const lista = document.getElementById('listaEstoque');
            select.innerHTML = "";
            lista.innerHTML = "<h3 class='mb-3 opacity-50 text-[0.6rem]'>INVENTÁRIO_DETECTADO:</h3>";

            dadosEstoque.slice(1).forEach(item => {
                const perc = (item[3] / item[2]) * 100;
                select.innerHTML += `<option value="${item[0]}">${item[0]}</option>`;
                lista.innerHTML += `
                    <div class="mb-3">
                        <div class="flex justify-between text-[0.6rem] mb-1"><span>${item[0]}</span><span>${item[3]}G / ${item[2]}G</span></div>
                        <div class="progress-bg"><div class="progress-fill" style="width: ${perc}%"></div></div>
                    </div>`;
            });
        }

        function calcular() {
            const materialNome = document.getElementById('selectMaterial').value;
            const mat = dadosEstoque.find(i => i[0] === materialNome) || ["Padrão", 120, 1000, 1000];

            const peso = parseFloat(document.getElementById('pesoPeca').value) || 0;
            const horas = parseFloat(document.getElementById('tempoHoras').value) || 0;

            const purga = (parseFloat(document.getElementById('cfgPurga').value) / 100) + 1;
            const maoObra = parseFloat(document.getElementById('cfgMaoObra').value);
            const embalagem = parseFloat(document.getElementById('cfgEmbalagem').value);
            const margemLucro = (parseFloat(document.getElementById('cfgLucroPerc').value) / 100) + 1;
            const kwh = parseFloat(document.getElementById('cfgKwh').value);
            const watts = parseFloat(document.getElementById('cfgConsumo').value);
            const vMaq = parseFloat(document.getElementById('cfgMaqVal').value);
            const vVida = parseFloat(document.getElementById('cfgVidaH').value);

            const cMaterial = ((peso * purga) / mat[2]) * mat[1];
            const cLuz = (watts / 1000) * horas * kwh; 
            const cDeprec = (vMaq / vVida) * horas; 
            const cMaoObra = maoObra * horas;

            const cTotal = cMaterial + cLuz + cDeprec + cMaoObra + embalagem;
            let precoSugerido = cTotal * margemLucro;

            const canal = document.getElementById('mkt').value;
            if(canal === 'ml') precoSugerido = (precoSugerido + 6) / 0.83;
            if(canal === 'shopee') precoSugerido = precoSugerido / 0.80;

            document.getElementById('detMat').innerText = `R$ ${cMaterial.toFixed(2)}`;
            document.getElementById('detFix').innerText = `R$ ${(cLuz + cDeprec).toFixed(2)}`;
            document.getElementById('detExtra').innerText = `R$ ${(cMaoObra + embalagem).toFixed(2)}`;
            document.getElementById('resCusto').innerText = `R$ ${cTotal.toFixed(2)}`;
            document.getElementById('resVenda').innerText = `R$ ${precoSugerido.toFixed(2)}`;
        }

        async function registrarPedido() {
            const btn = event.target;
            btn.innerText = "PROCESSANDO...";
            const data = {
                acao: "REGISTRAR_PEDIDO",
                material: document.getElementById('selectMaterial').value,
                peca: "Impressão_3D",
                pesoGasto: parseFloat(document.getElementById('pesoPeca').value),
                custo: document.getElementById('resCusto').innerText,
                precoVenda: document.getElementById('resVenda').innerText,
                mkt: document.getElementById('mkt').value
            };
            try {
                await fetch(URL_SCRIPT, { method: 'POST', body: JSON.stringify(data) });
                alert("REGISTRO_COMPLETO.");
                carregarDados();
            } catch(e) { alert("ERRO_DE_CONEXÃO"); }
            btn.innerText = "EXECUTAR_ORDEM_VENDA";
        }

        async function adicionarFilamento() {
            const data = {
                acao: "ADICIONAR_FILAMENTO",
                material: document.getElementById('novoNome').value,
                preco: parseFloat(document.getElementById('novoPreco').value),
                peso: parseFloat(document.getElementById('novoPeso').value)
            };
            await fetch(URL_SCRIPT, { method: 'POST', body: JSON.stringify(data) });
            alert("NOVO_MATERIAL_SINCRONIZADO.");
            carregarDados();
        }

        carregarDados();
    </script>
</body>
</html>
