<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Precificação 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial; background:#111; color:#fff; padding:15px }
h1 { margin-top:0 }
section { display:none }
section.active { display:block }
input, select, button {
  width:100%; padding:10px; margin:6px 0; font-size:16px;
}
button { background:#00c853; border:none; font-weight:bold }
.box { background:#1e1e1e; padding:15px; border-radius:10px; margin-bottom:15px }
ul { padding-left:18px }
</style>
</head>

<body>

<h1>Precificação 3D</h1>

<button onclick="show('estoque')">Estoque</button>
<button onclick="show('projeto')">Projeto</button>

<!-- ===== ESTOQUE ===== -->
<section id="estoque" class="box active">
  <h2>Filamentos</h2>

  <input id="nome" placeholder="Nome do filamento">
  <input id="preco" type="number" step="0.01" placeholder="Preço por grama (R$)">
  <input id="saldo" type="number" placeholder="Saldo (g)">

  <button onclick="addFilamento()">Adicionar Filamento</button>

  <h3>Estoque Atual</h3>
  <ul id="lista"></ul>
</section>

<!-- ===== PROJETO ===== -->
<section id="projeto" class="box">
  <h2>Projeto</h2>

  <label>Filamento</label>
  <select id="fil"></select>

  <label>Peso (g)</label>
  <input id="peso" type="number">

  <label>Horas de impressão</label>
  <input id="horas" type="number">

  <button onclick="calcular()">Calcular</button>

  <h3 id="res">Preço: R$ 0,00</h3>
</section>

<script>
/* ======================================================
   🔴 CONFIGURAÇÃO FIXA (JÁ AJUSTADA PRA VOCÊ)
====================================================== */

// URL do Google Form (formResponse)
const FORM_URL =
  "https://docs.google.com/forms/d/e/1FAIpQLSf26oMv7EjnQC124clAojJSrWSwCLl4Afqe1fk5No7WBfDP0w/formResponse";

// IDs dos campos do Form
const ENTRY_ACTION  = "entry.1318253980";
const ENTRY_PAYLOAD = "entry.1973534829";

// URL do Apps Script (leitura)
const API_URL = "https://script.google.com/macros/s/AKfycby4SPov2vVUGhoSAoQ4juRakKstF8hgoUuDVzsQD-28Fc394F_aSqfVCe5jTqMjtQfT/exec";

/* ======================================================
   ESTADO DO APP
====================================================== */
let estado = {
  estoque: []
};

/* ======================================================
   NAVEGAÇÃO
====================================================== */
function show(id){
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ======================================================
   BACKEND (FORMS + SHEETS)
====================================================== */
async function salvarEstado(){
  const form = new FormData();
  form.append(ENTRY_ACTION, "save");
  form.append(ENTRY_PAYLOAD, JSON.stringify(estado));

  await fetch(FORM_URL, {
    method: "POST",
    body: form,
    mode: "no-cors"
  });
}

async function carregarEstado(){
  const r = await fetch(API_URL);
  estado = await r.json();
  render();
}

/* ======================================================
   ESTOQUE
====================================================== */
function addFilamento(){
  const n = nome.value.trim();
  const p = Number(preco.value);
  const s = Number(saldo.value);

  if(!n || p <= 0 || s <= 0){
    alert("Preencha todos os campos corretamente");
    return;
  }

  estado.estoque.push({ nome:n, preco:p, saldo:s });

  salvarEstado().then(carregarEstado);

  nome.value = "";
  preco.value = "";
  saldo.value = "";
}

function render(){
  lista.innerHTML = "";
  fil.innerHTML = "";

  estado.estoque.forEach((f,i)=>{
    lista.innerHTML += `<li>${f.nome} — ${f.saldo} g</li>`;
    fil.innerHTML += `<option value="${i}">${f.nome}</option>`;
  });
}

/* ======================================================
   PROJETO (SIMPLIFICADO)
====================================================== */
function calcular(){
  if(estado.estoque.length === 0){
    alert("Cadastre um filamento");
    return;
  }

  const f = estado.estoque[fil.value];
  const p = Number(peso.value);
  const h = Number(horas.value);

  if(p <= 0 || h <= 0){
    alert("Valores inválidos");
    return;
  }

  const custo =
    (p * f.preco) +
    (h * 1.0); // custo fixo simples por hora

  res.innerText = "Preço: R$ " + custo.toFixed(2);
}

/* ======================================================
   INIT
====================================================== */
carregarEstado();
</script>

</body>
</html>
