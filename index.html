<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>333 Print Studio – Calculadora</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind + React -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const API_URL = "https://script.google.com/macros/s/AKfycbwa9oyc4qFMAA1ppHJjZhiEPIVWAhqikFmYip5T9OB5mNktXTFYSRKqpWZRXT6zf_zPJw/exec";

    function App() {
      const [estoque, setEstoque] = useState([]);
      const [settings, setSettings] = useState({});
      const [loading, setLoading] = useState(false);

      const [form, setForm] = useState({
        nome: "",
        peso: 0,
        tempo: 1
      });

      const [resultado, setResultado] = useState({
        custo: 0,
        preco: 0,
        lucro: 0
      });

      const n = v => isNaN(parseFloat(v)) ? 0 : parseFloat(v);

      // ======================
      // SINCRONIZAÇÃO INICIAL
      // ======================
      const sync = async () => {
        try {
          const r1 = await fetch(API_URL + "?type=read_data");
          const d1 = await r1.json();

          const r2 = await fetch(API_URL + "?type=read_settings");
          const d2 = await r2.json();

          setEstoque(d1.estoque || []);
          setSettings(d2 || {});
        } catch (e) {
          alert("Erro de sincronização com o backend");
          console.error(e);
        }
      };

      useEffect(() => {
        sync();
      }, []);

      // ======================
      // SIMULAR
      // ======================
      const simular = async () => {
        setLoading(true);
        try {
          const url =
            API_URL +
            `?type=simular&peso=${n(form.peso)}&tempo=${n(form.tempo)}&nc=${Date.now()}`;

          const r = await fetch(url);
          const data = await r.json();

          setResultado(data);
        } catch (e) {
          alert("Erro ao simular custo");
          console.error(e);
        }
        setLoading(false);
      };

      // ======================
      // GRAVAR VENDA
      // ======================
      const gravarVenda = async () => {
        if (!form.nome) {
          alert("Informe o nome do projeto");
          return;
        }

        try {
          const url =
            API_URL +
            `?type=venda&item=${encodeURIComponent(form.nome)}` +
            `&venda=${resultado.preco}&lucro=${resultado.lucro}`;

          await fetch(url);
          alert("Venda registrada com sucesso");
        } catch (e) {
          alert("Erro ao gravar venda");
          console.error(e);
        }
      };

      return (
        <div className="max-w-xl mx-auto mt-10 bg-white p-6 rounded-xl shadow space-y-6">
          <h1 className="text-2xl font-black text-slate-800">
            Calculadora de Impressão 3D
          </h1>

          <div className="space-y-3">
            <input
              className="w-full border rounded p-2"
              placeholder="Nome do projeto"
              value={form.nome}
              onChange={e => setForm({ ...form, nome: e.target.value })}
            />

            <input
              type="number"
              className="w-full border rounded p-2"
              placeholder="Peso total (g)"
              value={form.peso}
              onChange={e => setForm({ ...form, peso: e.target.value })}
            />

            <input
              type="number"
              className="w-full border rounded p-2"
              placeholder="Tempo de impressão (h)"
              value={form.tempo}
              onChange={e => setForm({ ...form, tempo: e.target.value })}
            />
          </div>

          <button
            onClick={simular}
            disabled={loading}
            className="w-full bg-blue-600 text-white py-3 rounded font-bold hover:bg-blue-500 disabled:opacity-50"
          >
            {loading ? "Calculando..." : "Simular"}
          </button>

          <div className="border-t pt-4 space-y-1 text-sm">
            <div>Custo: <b>R$ {resultado.custo.toFixed(2)}</b></div>
            <div>Lucro: <b>R$ {resultado.lucro.toFixed(2)}</b></div>
            <div className="text-lg font-black">
              Preço Ideal: R$ {resultado.preco.toFixed(2)}
            </div>
          </div>

          <button
            onClick={gravarVenda}
            className="w-full bg-emerald-600 text-white py-3 rounded font-bold hover:bg-emerald-500"
          >
            Gravar Venda
          </button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
