<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precificação 3D</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Precificação 3D</h1>

<div class="card">
<label>Filamento</label>
<select id="filamento">
<option>PLA Branco</option>
<option>PLA Preto</option>
<option>PETG Preto</option>
</select>

<label>Peso da peça (g)</label>
<input type="number" id="peso">

<label>Tempo de impressão (h)</label>
<input type="number" id="tempo">

<label>Marketplace</label>
<select id="marketplace">
<option>Shopee</option>
<option>Mercado Livre</option>
</select>

<button onclick="calcular()">Calcular</button>

<h2 id="resultado">Preço Final: R$ 0,00</h2>
</div>

<script src="app.js"></script>
</body>
</html>
