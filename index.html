<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Precificação 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#111;color:#fff;padding:15px}
section{display:none}
section.active{display:block}
input,select,button{width:100%;padding:10px;margin:6px 0}
button{background:#00c853;border:none;font-weight:bold}
.box{background:#1e1e1e;padding:15px;border-radius:10px;margin-bottom:15px}
</style>
</head>
<body>

<h1>Precificação 3D</h1>

<button onclick="show('estoque')">Estoque</button>
<button onclick="show('projeto')">Projeto</button>

<section id="estoque" class="box active">
  <input id="nome" placeholder="Filamento">
  <input id="preco" type="number" placeholder="Preço/g">
  <input id="saldo" type="number" placeholder="Saldo g">
  <button onclick="add()">Adicionar</button>
  <ul id="lista"></ul>
</section>

<section id="projeto" class="box">
  <select id="fil"></select>
  <input id="peso" type="number" placeholder="Peso g">
  <input id="horas" type="number" placeholder="Horas">
  <button onclick="calc()">Calcular</button>
  <h3 id="res">R$ 0,00</h3>
</section>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzBCIoPCZTwi4QwIfnwcej4yymhU2uwtUolwVeEhI_sxA3L3iIEo-tJzRsIJwjMloXkZQ/exec";

let estoque=[], config={}, rel=[];

function show(id){
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

async function load(){
  const r = await fetch(API_URL+"?action=load");
  const d = await r.json();
  estoque = d.estoque.map(x=>({nome:x[0],preco:x[1],saldo:x[2]}));
  config = Object.fromEntries(d.config);
  rel = d.relatorio;
  render();
}

async function save(){
  await fetch(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      action:"save",
      estoque:estoque.map(f=>[f.nome,f.preco,f.saldo]),
      config:Object.entries(config),
      relatorio:rel
    })
  });
}

function add(){
  estoque.push({nome:nome.value,preco:+preco.value,saldo:+saldo.value});
  save(); load();
}

function render(){
  lista.innerHTML="";
  fil.innerHTML="";
  estoque.forEach((f,i)=>{
    lista.innerHTML+=`<li>${f.nome} - ${f.saldo}g</li>`;
    fil.innerHTML+=`<option value="${i}">${f.nome}</option>`;
  });
}

function calc(){
  const f=estoque[fil.value];
  const v=(peso.value*f.preco)+(horas.value*1);
  res.innerText="R$ "+v.toFixed(2);
}

load();
</script>
</body>
</html>
