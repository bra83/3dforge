<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>333 Print Studio - Gestão</title>
    
    <!-- Meta tags PWA -->
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- Bibliotecas Base -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@900&display=swap');
        
        :root {
            --studio-white: #ffffff;
            --studio-ice: #f8fafc;
            --studio-border: #f1f5f9;
            --studio-accent: #3b82f6;
            --studio-text: #0f172a;
            --studio-muted: #94a3b8;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--studio-white); 
            color: var(--studio-text);
            -webkit-font-smoothing: antialiased;
        }

        /* Logo 333 simulando BBB (Estilo Super Mellow) */
        .logo-333 {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            letter-spacing: -0.18em; 
            font-size: 3rem;
            line-height: 0.7;
            color: var(--studio-text);
            display: inline-block;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.05));
            transform: scaleY(1.05);
        }

        .clean-card {
            background: #ffffff;
            border: 1px solid var(--studio-border);
            border-radius: 24px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.02);
            transition: all 0.3s ease;
        }

        .studio-input {
            background: var(--studio-ice) !important;
            border: 1px solid var(--studio-border) !important;
            border-radius: 14px;
            padding: 1rem;
            width: 100%;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: all 0.2s;
        }

        .studio-input:focus {
            border-color: var(--studio-accent) !important;
            background: white !important;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.04);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 700;
            color: var(--studio-muted);
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-item.active {
            background: var(--studio-ice);
            color: var(--studio-text);
            box-shadow: inset 0 0 0 1px var(--studio-border);
        }

        .btn-studio-black {
            background: var(--studio-text);
            color: white;
            padding: 1.2rem;
            border-radius: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-size: 11px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .btn-studio-black:active { transform: scale(0.96); }

        .progress-bar-fill { transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--studio-border); border-radius: 10px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.5s ease forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, Fragment } = React;

        // --- ICONES INLINE (SVG Puro para evitar erros de compilação) ---
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                calc: <path d="M16 2H8a2 2 0 00-2 2v16a2 2 0 002 2h8a2 2 0 002-2V4a2 2 0 00-2-2zM8 6h8M8 10h8M8 14h8M8 18h8" />,
                stock: <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />,
                settings: (
                    <Fragment>
                        <circle cx="12" cy="12" r="3" />
                        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" />
                    </Fragment>
                ),
                trash: <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" />,
                edit: <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 113 3L12 15l-4 1 1-4 9.5-9.5z" />,
                plus: <path d="M12 5v14M5 12h14" />,
                refresh: <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />,
                check: <path d="M20 6L9 17l-5-5" />,
                save: <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2zM17 21v-8H7v8M7 3v5h8" />
            };
            return (
                <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                    {icons[name]}
                </svg>
            );
        };

        const App = () => {
            // --- NAVEGAÇÃO E DADOS ---
            const [page, setPage] = useState('calc');
            const [state, setState] = useState({
                estoque: [],
                vendas: [],
                syncing: false,
                settings: JSON.parse(localStorage.getItem('333_vfinal_config')) || {
                    aluguel: 210, softwares: 95, ecommerce: 59.9, mei: 60, publicidade: 100, condominio: 100,
                    kwh: 1.14, potencia: 350, precoMaq: 1500, vidaUtil: 24, embalagem: 3, markup: 2.5,
                    pintSimples: 15, pintMedia: 35, pintProf: 60, meta: 6600, 
                    urlRead: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRCBq2SPd_0aPaNJZzu0vH02ZtYc0KYhSHfYyoJiVMRwk9wkmPWPQXngFKpZFUZPwWJ7_sdlMiccny8/pub?gid=0&single=true&output=csv",
                    urlReadVendas: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRCBq2SPd_0aPaNJZzu0vH02ZtYc0KYhSHfYyoJiVMRwk9wkmPWPQXngFKpZFUZPwWJ7_sdlMiccny8/pub?gid=77191586&single=true&output=csv",
                    urlWrite: "https://script.google.com/macros/s/AKfycbwEQYbvahyzNbicUb_C4aUmmfy1w2iTKbEbSnGk8pPBhHOaPcmqrDEURXe6KHfsdwGl1w/exec"
                }
            });

            const [calcForm, setCalcForm] = useState({ nome: '', tempo: 10, peso: 100, matIdx: 0, pintura: 'media' });
            const [matForm, setMatForm] = useState({ nome: '', peso: 1000, preco: 120, editing: false });
            const [toast, setToast] = useState({ show: false, msg: '' });

            const showToast = (msg) => {
                setToast({ show: true, msg });
                setTimeout(() => setToast({ show: false, msg: '' }), 3000);
            };

            const sincronizar = async () => {
                setState(prev => ({ ...prev, syncing: true }));
                try {
                    const [stRes, saRes] = await Promise.all([
                        fetch(`${state.settings.urlRead}&t=${Date.now()}`).then(r => r.text()),
                        fetch(`${state.settings.urlReadVendas}&t=${Date.now()}`).then(r => r.text())
                    ]);

                    const stData = Papa.parse(stRes, { header: true, skipEmptyLines: true }).data.map((r, i) => {
                        const k = {}; Object.keys(r).forEach(key => k[key.trim().toLowerCase()] = r[key]);
                        return { id: i, nome: k.nome || k.material || "Filamento", peso: parseFloat(String(k.peso).replace(',', '.')) || 0, preco: parseFloat(String(k.preco).replace(',', '.')) || 0 };
                    }).filter(x => x.nome);

                    const saData = Papa.parse(saRes, { header: true, skipEmptyLines: true }).data.map(r => {
                        const k = {}; Object.keys(r).forEach(key => k[key.trim().toLowerCase()] = r[key]);
                        const fix = (v) => parseFloat(String(v || 0).replace(/[R$\s.]/g, '').replace(',', '.')) || 0;
                        return { data: k.data || "-", item: k.item || "Venda", venda: fix(k.venda), lucro: fix(k.lucro) };
                    }).filter(v => v.venda > 0);

                    setState(prev => ({ ...prev, estoque: stData, vendas: saData, syncing: false }));
                    showToast("Dados Sincronizados");
                } catch (e) { setState(prev => ({ ...prev, syncing: false })); showToast("Erro Cloud"); }
            };

            useEffect(() => { sincronizar(); }, []);

            // --- LÓGICA FINANCEIRA ---
            const financeiro = useMemo(() => {
                if (!state.estoque.length) return null;
                const mat = state.estoque[calcForm.matIdx] || state.estoque[0];
                const cMat = (calcForm.peso / 1000) * mat.preco;
                const cLuz = (state.settings.potencia / 1000) * calcForm.tempo * state.settings.kwh;
                const cAmort = (state.settings.precoMaq / state.settings.vidaUtil / 30 / 24) * calcForm.tempo;
                const tFixoTotal = parseFloat(state.settings.aluguel) + parseFloat(state.settings.softwares) + parseFloat(state.settings.ecommerce) + parseFloat(state.settings.mei) + parseFloat(state.settings.publicidade) + parseFloat(state.settings.condominio);
                const cFixoProp = (tFixoTotal / 4000) * calcForm.tempo;

                const custoBaseReal = cMat + cLuz + cAmort + cFixoProp + parseFloat(state.settings.embalagem);

                let cPint = 0;
                if(calcForm.pintura === "simples") cPint = parseFloat(state.settings.pintSimples);
                else if(calcForm.pintura === "media") cPint = parseFloat(state.settings.pintMedia);
                else if(calcForm.pintura === "profissional") cPint = parseFloat(state.settings.pintProf);

                const sugerido = (custoBaseReal + cPint) * state.settings.markup;

                return {
                    custoBase: custoBaseReal,
                    sugerido,
                    lucro: sugerido - (custoBaseReal + cPint),
                    shopee: (sugerido + 4) / 0.8,
                    ml: (sugerido + 6) / 0.81
                };
            }, [calcForm, state.settings, state.estoque]);

            // --- AÇÕES API ---
            const apiCall = async (type, data) => {
                showToast("Aguarde...");
                const q = new URLSearchParams({ type, ...data });
                try {
                    await fetch(`${state.settings.urlWrite}?${q.toString()}`, { method: 'GET', mode: 'no-cors' });
                    setTimeout(sincronizar, 2500);
                    showToast("Sucesso!");
                    return true;
                } catch (e) { showToast("Erro no servidor"); return false; }
            };

            const fatTotal = state.vendas.reduce((acc, v) => acc + v.venda, 0);
            const lucTotal = state.vendas.reduce((acc, v) => acc + v.lucro, 0);

            return (
                <div className="flex flex-col lg:flex-row min-h-screen bg-white">
                    
                    {/* SIDEBAR */}
                    <aside className="w-full lg:w-72 border-b lg:border-r border-slate-50 p-8 flex flex-col bg-white">
                        <div className="mb-12 flex items-center gap-4">
                            <div className="logo-333">333</div>
                            <div className="h-10 w-px bg-slate-100"></div>
                            <span className="font-extrabold text-[11px] text-slate-300 uppercase tracking-[0.2em] leading-tight">Print<br/>Studio</span>
                        </div>
                        
                        <nav className="space-y-2 flex-1">
                            <div onClick={() => setPage('calc')} className={`nav-item ${page === 'calc' ? 'active' : ''}`}>
                                <Icon name="calc" className="w-4 h-4" /> Calculadora
                            </div>
                            <div onClick={() => setPage('estoque')} className={`nav-item ${page === 'estoque' ? 'active' : ''}`}>
                                <Icon name="stock" className="w-4 h-4" /> Gerir Estoque
                            </div>
                            <div onClick={() => setPage('settings')} className={`nav-item ${page === 'settings' ? 'active' : ''}`}>
                                <Icon name="settings" className="w-4 h-4" /> Definições
                            </div>
                        </nav>

                        <div className="mt-12 p-6 bg-slate-50 rounded-[24px] border border-slate-100">
                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Conexão Cloud</p>
                            <div className="flex items-center gap-3">
                                <div className={`w-2.5 h-2.5 rounded-full ${state.syncing ? 'bg-blue-400 animate-pulse' : 'bg-emerald-400'}`}></div>
                                <span className="text-[10px] font-black text-slate-900 uppercase">Banco Online</span>
                            </div>
                        </div>
                    </aside>

                    {/* CONTENT */}
                    <main className="flex-1 p-8 md:p-12 lg:p-20 overflow-y-auto custom-scrollbar animate-fade">
                        
                        {/* PAGE: CALCULADORA */}
                        {page === 'calc' && (
                            <div className="grid grid-cols-1 xl:grid-cols-2 gap-16 max-w-[1200px]">
                                <section className="space-y-10">
                                    <header>
                                        <h2 className="text-[10px] font-black text-blue-500 uppercase tracking-[0.4em] mb-3">Orçamentista</h2>
                                        <p className="text-3xl font-bold text-slate-900">Configurar Ordem</p>
                                    </header>
                                    
                                    <div className="space-y-6">
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black text-slate-400 uppercase ml-1">Nome do Item</label>
                                            <input type="text" value={calcForm.nome} onChange={e => setCalcForm(p => ({...p, nome: e.target.value}))} className="studio-input" placeholder="Ex: Diorama S-333" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-6">
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black text-slate-400 uppercase ml-1">Tempo (h)</label>
                                                <input type="number" value={calcForm.tempo} onChange={e => setCalcForm(p => ({...p, tempo: parseFloat(e.target.value)}))} className="studio-input" />
                                            </div>
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black text-slate-400 uppercase ml-1">Peso (g)</label>
                                                <input type="number" value={calcForm.peso} onChange={e => setCalcForm(p => ({...p, peso: parseFloat(e.target.value)}))} className="studio-input" />
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-6">
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black text-slate-400 uppercase ml-1">Insumo</label>
                                                <select value={calcForm.matIdx} onChange={e => setCalcForm(p => ({...p, matIdx: e.target.value}))} className="studio-input appearance-none">
                                                    {state.estoque.map((m, i) => <option key={i} value={i}>{m.nome}</option>)}
                                                </select>
                                            </div>
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black text-slate-400 uppercase ml-1">Pintura</label>
                                                <select value={calcForm.pintura} onChange={e => setCalcForm(p => ({...p, pintura: e.target.value}))} className="studio-input appearance-none">
                                                    <option value="0">Cru</option>
                                                    <option value="simples">Simples</option>
                                                    <option value="media">Média</option>
                                                    <option value="profissional">Profissional</option>
                                                </select>
                                            </div>
                                        </div>
                                        <button onClick={() => apiCall('venda', {
                                            item: calcForm.nome || "Item 333",
                                            material: state.estoque[calcForm.matIdx]?.nome || "Padrão",
                                            peso: calcForm.peso,
                                            venda: financeiro?.sugerido.toFixed(2),
                                            lucro: financeiro?.lucro.toFixed(2)
                                        })} className="w-full btn-studio-black shadow-xl shadow-slate-100">Registrar na Planilha</button>
                                    </div>
                                </section>

                                <section className="space-y-8">
                                    <div className="clean-card p-10 space-y-10">
                                        <div className="flex justify-between items-center bg-slate-50 p-6 rounded-2xl border border-slate-100">
                                            <span className="text-[10px] font-black text-slate-300 uppercase tracking-widest">Custo Real da Peça</span>
                                            <span className="text-xl font-bold text-slate-500 italic">R$ {financeiro?.custoBase.toFixed(2)}</span>
                                        </div>

                                        <div className="space-y-10">
                                            <div className="text-center">
                                                <p className="text-[10px] font-black text-slate-300 uppercase tracking-[0.4em] mb-4">Sugerido p/ Venda</p>
                                                <p className="text-4xl font-black text-slate-900 tracking-tighter italic underline decoration-blue-500 decoration-4 underline-offset-8">R$ {financeiro?.sugerido.toFixed(2)}</p>
                                            </div>
                                            <div className="text-center">
                                                <p className="text-[10px] font-black text-slate-300 uppercase tracking-[0.4em] mb-4">Lucro Líquido</p>
                                                <p className="text-4xl font-black text-blue-500 tracking-tighter italic">R$ {financeiro?.lucro.toFixed(2)}</p>
                                            </div>
                                        </div>
                                        
                                        <div className="grid grid-cols-2 gap-6 pt-6 border-t border-slate-50">
                                            <div className="p-4 bg-slate-50/50 rounded-2xl text-center border border-slate-100">
                                                <p className="text-[9px] font-black text-slate-400 uppercase mb-1">Shopee</p>
                                                <p className="font-bold text-slate-700">R$ {financeiro?.shopee.toFixed(2)}</p>
                                            </div>
                                            <div className="p-4 bg-slate-50/50 rounded-2xl text-center border border-slate-100">
                                                <p className="text-[9px] font-black text-slate-400 uppercase mb-1">M. Livre</p>
                                                <p className="font-bold text-slate-700">R$ {financeiro?.ml.toFixed(2)}</p>
                                            </div>
                                        </div>
                                    </div>
                                </section>
                            </div>
                        )}

                        {/* PAGE: ESTOQUE */}
                        {page === 'estoque' && (
                            <div className="max-w-[1000px] space-y-16">
                                <header className="flex justify-between items-end">
                                    <div>
                                        <h2 className="text-[10px] font-black text-emerald-500 uppercase tracking-[0.4em] mb-3">Suprimentos</h2>
                                        <p className="text-3xl font-bold text-slate-900">Gestão de Filamentos</p>
                                    </div>
                                    <button onClick={sincronizar} className="p-3 bg-slate-50 rounded-full hover:bg-slate-100 transition-colors"><Icon name="refresh" className="w-4 h-4 text-slate-400" /></button>
                                </header>

                                {/* Formulário de Edição/Criação */}
                                <div className="clean-card p-10 bg-slate-50/30">
                                    <h3 className="text-[10px] font-black uppercase text-slate-400 mb-8 tracking-widest flex items-center gap-2">
                                        {matForm.editing ? <Icon name="edit" className="w-3 h-3"/> : <Icon name="plus" className="w-3 h-3"/>}
                                        {matForm.editing ? 'Alterar Registro' : 'Lançar Insumo'}
                                    </h3>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8 items-end">
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Descrição</label>
                                            <input type="text" value={matForm.nome} onChange={e => setMatForm(p => ({...p, nome: e.target.value}))} className="studio-input" placeholder="Ex: PLA 333 Silk White" />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Peso (g)</label>
                                            <input type="number" value={matForm.peso} onChange={e => setMatForm(p => ({...p, peso: parseFloat(e.target.value)}))} className="studio-input" />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Preço Unitário</label>
                                            <input type="number" value={matForm.preco} onChange={e => setMatForm(p => ({...p, preco: parseFloat(e.target.value)}))} className="studio-input" />
                                        </div>
                                        <div className="md:col-span-3 flex gap-4">
                                            <button onClick={() => {
                                                apiCall(matForm.editing ? 'edit_estoque' : 'estoque', matForm);
                                                setMatForm({nome:'', peso:1000, preco:120, editing:false});
                                            }} className="flex-1 btn-studio-black">
                                                {matForm.editing ? 'Finalizar Edição' : 'Registrar Insumo'}
                                            </button>
                                            {matForm.editing && <button onClick={() => setMatForm({nome:'', peso:1000, preco:120, editing:false})} className="px-6 py-4 rounded-xl border border-slate-200 text-xs font-bold text-slate-400 uppercase">Cancelar</button>}
                                        </div>
                                    </div>
                                </div>

                                {/* LISTA DE MATERIAIS */}
                                <div className="grid grid-cols-1 gap-6">
                                    {state.estoque.map((m, i) => {
                                        const p = Math.max(0, Math.min(100, (m.peso / 1000) * 100));
                                        return (
                                            <div key={i} className="clean-card p-8 flex flex-col md:flex-row md:items-center justify-between gap-10">
                                                <div className="flex-1">
                                                    <div className="flex justify-between items-end mb-3">
                                                        <span className="font-extrabold text-slate-900 uppercase tracking-tighter text-lg">{m.nome}</span>
                                                        <span className="font-mono text-xs text-slate-300">{m.peso.toFixed(0)}g</span>
                                                    </div>
                                                    <div className="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                                                        <div className={`h-full progress-bar-fill ${p < 20 ? 'bg-rose-400' : 'bg-blue-400'}`} style={{ width: `${p}%` }}></div>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-6">
                                                    <span className="font-bold text-slate-900 text-sm">R$ {m.preco.toFixed(2)}</span>
                                                    <div className="flex gap-2">
                                                        <button onClick={() => setMatForm({...m, editing: true})} className="p-3 hover:bg-blue-50 text-slate-300 hover:text-blue-500 rounded-xl border border-slate-50 transition-all"><Icon name="edit" className="w-4 h-4" /></button>
                                                        <button onClick={() => apiCall('delete_estoque', { nome: m.nome })} className="p-3 hover:bg-rose-50 text-slate-300 hover:text-rose-500 rounded-xl border border-slate-50 transition-all"><Icon name="trash" className="w-4 h-4" /></button>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* PAGE: SETTINGS */}
                        {page === 'settings' && (
                            <div className="max-w-[1000px] space-y-16">
                                <div>
                                    <h2 className="text-[10px] font-black text-slate-300 uppercase tracking-[0.4em] mb-3">System Node</h2>
                                    <p className="text-3xl font-bold text-slate-900">Parâmetros do Studio</p>
                                </div>

                                <div className="grid grid-cols-2 md:grid-cols-4 gap-10">
                                    {Object.keys(state.settings).filter(k => typeof state.settings[k] === 'number').map(key => (
                                        <div key={key} className="space-y-3">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">{key}</label>
                                            <input 
                                                type="number" 
                                                value={state.settings[key]} 
                                                onChange={e => setState(p => ({...p, settings: {...p.settings, [key]: parseFloat(e.target.value)}}))} 
                                                className="studio-input font-bold" 
                                            />
                                        </div>
                                    ))}
                                </div>

                                <div className="space-y-8 pt-12 border-t border-slate-100">
                                    <div className="space-y-3">
                                        <label className="text-[10px] font-black text-blue-500 uppercase tracking-widest ml-1">URL de Escrita Cloud</label>
                                        <input type="text" value={state.settings.urlWrite} onChange={e => setState(p => ({...p, settings: {...p.settings, urlWrite: e.target.value}}))} className="studio-input font-mono text-xs opacity-50 focus:opacity-100" />
                                    </div>
                                    <button onClick={() => { 
                                        localStorage.setItem('333_v10_settings', JSON.stringify(state.settings)); 
                                        showToast("Configurações Salvas Localmente"); 
                                    }} className="btn-studio-black w-full shadow-2xl shadow-slate-100">Sincronizar Definições</button>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* TOAST */}
                    {toast.show && (
                        <div className="fixed bottom-12 left-1/2 -translate-x-1/2 bg-slate-950 text-white px-12 py-5 rounded-3xl shadow-2xl z-[1000] font-black text-[10px] uppercase tracking-[0.3em] flex items-center gap-4 animate-fade border border-slate-800">
                            <span className="w-2.5 h-2.5 rounded-full bg-blue-500"></span> {toast.msg}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
