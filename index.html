<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XP4NERD - Gestão Pro</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="333 Studio">
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="pb-20 md:pb-0">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, Fragment } = React;

const App = () => {

  const HARDCODED_URL = "https://script.google.com/macros/s/AKfycbzmLU3BvkTG0MGg0QeL-YZZniHMwPh_Ki1GEwxUB97KRR3atX_gDp64nBB3_tC5cTpP2g/exec";

  const basicConfigKeys = ["markup","kwh","potencia","embalagem","pintSimples","pintMedia","pintProf"];
  const advancedConfigKeys = ["aluguel","softwares","ecommerce","mei","publicidade","condominio","precoMaq","vidaUtil","horasTrab","FatPrevisto"];
  const configKeys = [...basicConfigKeys, ...advancedConfigKeys];

  const [advancedMode, setAdvancedMode] = useState(false);
  const [settings, setSettings] = useState({});

  useEffect(() => {
    fetch(`${HARDCODED_URL}?type=read_settings`)
      .then(r => r.json())
      .then(d => setSettings(d || {}));
  }, []);

  return (
    <div className="p-6 max-w-5xl mx-auto">
      <h2 className="text-2xl font-bold text-center mb-6">Ajustes Studio</h2>

      <div className="flex justify-center gap-4 mb-8">
        <button onClick={()=>setAdvancedMode(false)} className={`btn-primary ${!advancedMode?'bg-blue-600':'bg-slate-400'}`}>Básico</button>
        <button onClick={()=>setAdvancedMode(true)} className={`btn-primary ${advancedMode?'bg-blue-600':'bg-slate-400'}`}>Avançado</button>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        {(advancedMode?configKeys:basicConfigKeys).map(k=>(
          <div key={k} className="border rounded-xl p-4 text-center">
            <label className="text-xs uppercase text-slate-400">{k}</label>
            <input
              type="number"
              value={settings[k]||0}
              onChange={e=>setSettings({...settings,[k]:e.target.value})}
              className="w-full text-xl font-bold text-center outline-none"
            />
          </div>
        ))}
      </div>

      <button
        onClick={()=>{
          const p=new URLSearchParams({type:'save_settings',...settings});
          fetch(`${HARDCODED_URL}?${p.toString()}`);
          alert("Configurações salvas");
        }}
        className="btn-primary w-full mt-8"
      >
        Salvar Todas as Variáveis
      </button>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js");
}
</script>
</body>
</html>
