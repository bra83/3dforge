<!DOCTYPE html>
<!--
INDEX.HTML CORRIGIDO – 333 PRINT STUDIO
Versão com cálculo centralizado no Apps Script (type=simular)
Compatível com backend enviado
-->
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>333 Print Studio - Gestão Pro</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-slate-50">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const API_URL = "https://script.google.com/macros/s/AKfycbyB-__MtF_xGoaFTHQSrJXlX_iN_SBjR41iTgpXKU5GosyKyZr3Nr_5S24xmxWkKlFpyg/exec";

  const [estoque, setEstoque] = useState([]);
  const [settings, setSettings] = useState({});
  const [calc, setCalc] = useState({ tempo: 1, peso: 0, nome: "" });
  const [resultado, setResultado] = useState({ custo: 0, preco: 0, lucro: 0 });
  const [loading, setLoading] = useState(false);

  const n = v => isNaN(parseFloat(v)) ? 0 : parseFloat(v);

  const sync = async () => {
    const d = await fetch(API_URL + "?type=read_data").then(r => r.json());
    const s = await fetch(API_URL + "?type=read_settings").then(r => r.json());
    setEstoque(d.estoque || []);
    setSettings(s || {});
  };

  const simular = async () => {
    setLoading(true);
    const pesoTotal = calc.peso;
    const url = `${API_URL}?type=simular&peso=${pesoTotal}&tempo=${calc.tempo}&nc=${Date.now()}`;
    const r = await fetch(url).then(r => r.json());
    setResultado(r);
    setLoading(false);
  };

  const gravarVenda = async () => {
    await fetch(`${API_URL}?type=venda&item=${calc.nome}&venda=${resultado.preco}&lucro=${resultado.lucro}`);
    alert("Venda registrada");
  };

  useEffect(() => { sync(); }, []);

  return (
    <div className="max-w-xl mx-auto p-6 space-y-6">
      <h1 className="text-2xl font-black">Calculadora 3D</h1>

      <input className="border p-2 w-full" placeholder="Projeto"
        value={calc.nome} onChange={e=>setCalc({...calc, nome:e.target.value})} />

      <input className="border p-2 w-full" type="number" placeholder="Tempo (h)"
        value={calc.tempo} onChange={e=>setCalc({...calc, tempo:n(e.target.value)})} />

      <input className="border p-2 w-full" type="number" placeholder="Peso total (g)"
        value={calc.peso} onChange={e=>setCalc({...calc, peso:n(e.target.value)})} />

      <button onClick={simular} className="bg-blue-600 text-white p-3 rounded">
        {loading ? "Calculando..." : "Simular"}
      </button>

      <div className="bg-white p-4 rounded shadow space-y-2">
        <div>Custo: R$ {resultado.custo?.toFixed(2)}</div>
        <div>Lucro: R$ {resultado.lucro?.toFixed(2)}</div>
        <div className="font-bold">Preço Ideal: R$ {resultado.preco?.toFixed(2)}</div>
      </div>

      <button onClick={gravarVenda} className="bg-emerald-600 text-white p-3 rounded">
        Gravar Venda
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
