<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimório Industrial 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        body { background-color: #0f172a; color: #f1f5f9; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid #334155; border-radius: 16px; }
        input, select { background: #1e293b; border: 1px solid #475569; color: white; padding: 10px; border-radius: 8px; width: 100%; transition: 0.3s; }
        input:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .btn-action { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); transition: transform 0.2s; }
        .btn-action:active { transform: scale(0.95); }
    </style>
</head>
<body class="p-4 max-w-md mx-auto pb-24">

    <header class="text-center my-6">
        <h1 class="text-3xl font-bold text-blue-400">Arquiteto 3D</h1>
        <p class="text-slate-400 text-sm italic">Gestão de Forja e Mercadorias</p>
    </header>

    <div class="glass-card p-6 mb-6">
        <h2 class="text-blue-300 font-semibold mb-4 flex items-center">⚙️ Configurações Base</h2>
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="text-xs text-slate-400">Preço kWh (R$)</label>
                <input type="number" id="cfgKwh" value="0.85" step="0.01" oninput="calcularTudo()">
            </div>
            <div>
                <label class="text-xs text-slate-400">Consumo (Watts)</label>
                <input type="number" id="cfgWatts" value="150" oninput="calcularTudo()">
            </div>
            <div>
                <label class="text-xs text-slate-400">Valor Máquina (R$)</label>
                <input type="number" id="cfgMaq" value="2000" oninput="calcularTudo()">
            </div>
            <div>
                <label class="text-xs text-slate-400">Vida Útil (Horas)</label>
                <input type="number" id="cfgVida" value="5000" oninput="calcularTudo()">
            </div>
        </div>
    </div>

    <div class="glass-card p-6 mb-6">
        <h2 class="text-green-300 font-semibold mb-4">🔮 Calculadora de Impressão</h2>
        
        <div class="space-y-4">
            <div>
                <label class="text-xs text-slate-400">Peso da Peça (gramas)</label>
                <input type="number" id="pesoPeca" placeholder="Ex: 150" oninput="calcularTudo()">
            </div>
            <div>
                <label class="text-xs text-slate-400">Tempo Estimado (horas)</label>
                <input type="number" id="tempoHoras" placeholder="Ex: 12" oninput="calcularTudo()">
            </div>
            <div>
                <label class="text-xs text-slate-400">Material Utilizado</label>
                <select id="selMaterial" onchange="calcularTudo()">
                    <option value="120">PLA (R$ 120/kg)</option>
                    <option value="110">PETG (R$ 110/kg)</option>
                    <option value="150">ABS (R$ 150/kg)</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-slate-400">Local de Venda</label>
                <select id="selMkt" onchange="calcularTudo()">
                    <option value="direta">Venda Direta (0%)</option>
                    <option value="ml">Mercado Livre (17% + R$ 6,00)</option>
                    <option value="shopee">Shopee (20%)</option>
                </select>
            </div>
        </div>

        <div class="mt-8 p-4 bg-slate-900/50 rounded-xl border border-blue-500/30">
            <div class="flex justify-between text-sm mb-1">
                <span>Custo Real:</span>
                <span id="resCusto" class="font-mono text-slate-300">R$ 0,00</span>
            </div>
            <div class="flex justify-between text-lg font-bold border-t border-slate-700 pt-2 mt-2">
                <span class="text-blue-400">Preço de Venda:</span>
                <span id="resVenda" class="text-green-400">R$ 0,00</span>
            </div>
            <p class="text-[10px] text-slate-500 mt-2 text-center">Cálculo: Custo + 100% de margem + Taxas do Market.</p>
        </div>

        <button onclick="enviarPedido()" class="btn-action w-full mt-6 py-4 rounded-xl font-bold shadow-lg shadow-blue-900/20">
            REALIZAR PEDIDO / BAIXAR ESTOQUE
        </button>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbws1Ltn_D-VG5s7utXwyBc1m5764U9naa26jo3tnR38UcEnq3270-0b6ttBlCVWr43m/exec";

        function calcularTudo() {
            // Entradas
            const kwh = parseFloat(document.getElementById('cfgKwh').value) || 0;
            const watts = parseFloat(document.getElementById('cfgWatts').value) || 0;
            const vMaq = parseFloat(document.getElementById('cfgMaq').value) || 0;
            const vidaH = parseFloat(document.getElementById('cfgVida').value) || 0;

            const pesoG = parseFloat(document.getElementById('pesoPeca').value) || 0;
            const tempoH = parseFloat(document.getElementById('tempoHoras').value) || 0;
            const precoKg = parseFloat(document.getElementById('selMaterial').value) || 0;
            const mkt = document.getElementById('selMkt').value;

            // Fórmulas de Custo
            const custoFilamento = (pesoG / 1000) * precoKg;
            const custoLuz = (watts / 1000) * tempoH * kwh;
            const custoVida = (vMaq / vidaH) * tempoH;
            
            const custoTotal = custoFilamento + custoLuz + custoVida;
            let precoComLucro = custoTotal * 2; // Margem de 100%

            // Taxas Marketplace
            let precoFinal = precoComLucro;
            if (mkt === 'ml') {
                precoFinal = (precoComLucro + 6) / 0.83;
            } else if (mkt === 'shopee') {
                precoFinal = precoComLucro / 0.80;
            }

            document.getElementById('resCusto').innerText = "R$ " + custoTotal.toFixed(2);
            document.getElementById('resVenda').innerText = "R$ " + precoFinal.toFixed(2);
        }

        async function enviarPedido() {
            const pesoG = document.getElementById('pesoPeca').value;
            const matTxt = document.getElementById('selMaterial').options[document.getElementById('selMaterial').selectedIndex].text;
            
            if(!pesoG) return alert("Insira o peso!");

            const payload = {
                peca: "Nova Impressão",
                material: matTxt.split(' ')[0],
                pesoGasto: parseFloat(pesoG),
                custo: document.getElementById('resCusto').innerText,
                precoVenda: document.getElementById('resVenda').innerText,
                mkt: document.getElementById('selMkt').value
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                alert("Pedido registrado e estoque baixado!");
            } catch (error) {
                console.error(error);
                alert("Erro ao conectar com a planilha. Verifique a URL do Script.");
            }
        }
    </script>
</body>
</html>
