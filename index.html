<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Forja 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid #334155; border-radius: 16px; margin-bottom: 20px; }
        input, select { background: #1e293b; border: 1px solid #475569; color: white; padding: 10px; border-radius: 8px; width: 100%; }
        .btn-action { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; }
        .status-low { color: #ef4444; font-weight: bold; }
        .status-ok { color: #22c55e; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto pb-24">

    <header class="text-center my-6">
        <h1 class="text-2xl font-bold text-blue-400">Mestre da Forja 3D</h1>
        <p class="text-slate-400 text-sm">Sincronizado com Google Sheets</p>
    </header>

    <div class="glass-card p-4">
        <h2 class="text-blue-300 font-semibold mb-3 flex justify-between">
            📦 Estoque em Tempo Real
            <button onclick="carregarDados()" class="text-xs bg-slate-700 px-2 py-1 rounded">🔄 Atualizar</button>
        </h2>
        <div id="tabelaEstoque" class="text-xs space-y-2">
            <p>Carregando estoque da planilha...</p>
        </div>
    </div>

    <div class="glass-card p-6">
        <h2 class="text-green-300 font-semibold mb-4">🔮 Nova Encomenda</h2>
        
        <div class="space-y-4">
            <div>
                <label class="text-xs text-slate-400">Material</label>
                <select id="selMaterial" onchange="calcularTudo()">
                    <option value="">Carregando materiais...</option>
                </select>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs text-slate-400">Peso (g)</label>
                    <input type="number" id="pesoPeca" placeholder="0" oninput="calcularTudo()">
                </div>
                <div>
                    <label class="text-xs text-slate-400">Tempo (h)</label>
                    <input type="number" id="tempoHoras" placeholder="0" oninput="calcularTudo()">
                </div>
            </div>
            <div>
                <label class="text-xs text-slate-400">Canal de Venda</label>
                <select id="selMkt" onchange="calcularTudo()">
                    <option value="direta">Venda Direta (0%)</option>
                    <option value="ml">Mercado Livre (17% + R$ 6,00)</option>
                    <option value="shopee">Shopee (20%)</option>
                </select>
            </div>
        </div>

        <div class="mt-6 p-4 bg-slate-900/50 rounded-xl border border-blue-500/30">
            <div class="flex justify-between text-sm">
                <span>Custo de Produção:</span>
                <span id="resCusto" class="font-mono">R$ 0,00</span>
            </div>
            <div class="flex justify-between text-lg font-bold mt-2 pt-2 border-t border-slate-700">
                <span class="text-blue-400">Preço Sugerido:</span>
                <span id="resVenda" class="text-green-400">R$ 0,00</span>
            </div>
        </div>

        <button onclick="enviarPedido()" id="btnEnviar" class="btn-action mt-6 shadow-lg">
            CONFIRMAR E BAIXAR ESTOQUE
        </button>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbws1Ltn_D-VG5s7utXwyBc1m5764U9naa26jo3tnR38UcEnq3270-0b6ttBlCVWr43m/exec";
        let dadosEstoqueGlobal = [];

        // Configurações fixas para custo de luz e máquina
        const CONFIG = { kwh: 0.85, watts: 150, vMaq: 2000, vidaH: 5000 };

        async function carregarDados() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                dadosEstoqueGlobal = data; // Salva para uso na calculadora
                
                // 1. Preencher a Tabela de Estoque Visual
                let htmlEstoque = "";
                let htmlSelect = "";
                
                // Começa do 1 para pular o cabeçalho da planilha
                for(let i = 1; i < data.length; i++) {
                    const [nome, preco, pesoTotal, pesoAtual] = data[i];
                    const statusClass = pesoAtual < 200 ? 'status-low' : 'status-ok';
                    
                    htmlEstoque += `
                        <div class="flex justify-between border-b border-slate-700 pb-1">
                            <span>${nome}</span>
                            <span class="${statusClass}">${pesoAtual}g restantes</span>
                        </div>`;
                    
                    htmlSelect += `<option value="${preco}" data-nome="${nome}">${nome} (R$ ${preco}/kg)</option>`;
                }
                
                document.getElementById('tabelaEstoque').innerHTML = htmlEstoque;
                document.getElementById('selMaterial').innerHTML = htmlSelect;
                calcularTudo();
            } catch (e) {
                document.getElementById('tabelaEstoque').innerHTML = "Erro ao carregar dados. Verifique a planilha.";
            }
        }

        function calcularTudo() {
            const precoKg = parseFloat(document.getElementById('selMaterial').value) || 0;
            const pesoG = parseFloat(document.getElementById('pesoPeca').value) || 0;
            const tempoH = parseFloat(document.getElementById('tempoHoras').value) || 0;
            const mkt = document.getElementById('selMkt').value;

            const custoFilamento = (pesoG / 1000) * precoKg;
            const custoLuz = (CONFIG.watts / 1000) * tempoH * CONFIG.kwh;
            const custoVida = (CONFIG.vMaq / CONFIG.vidaH) * tempoH;
            
            const custoTotal = custoFilamento + custoLuz + custoVida;
            let precoBase = custoTotal * 2; // Lucro 100%

            if (mkt === 'ml') precoBase = (precoBase + 6) / 0.83;
            if (mkt === 'shopee') precoBase = precoBase / 0.80;

            document.getElementById('resCusto').innerText = "R$ " + custoTotal.toFixed(2);
            document.getElementById('resVenda').innerText = "R$ " + precoBase.toFixed(2);
        }

        async function enviarPedido() {
            const btn = document.getElementById('btnEnviar');
            const pesoG = document.getElementById('pesoPeca').value;
            const select = document.getElementById('selMaterial');
            const nomeMat = select.options[select.selectedIndex].getAttribute('data-nome');

            if(!pesoG || !nomeMat) return alert("Preencha os dados!");

            btn.innerText = "PROCESSANDO...";
            btn.disabled = true;

            const payload = {
                peca: "Pedido via Dashboard",
                material: nomeMat,
                pesoGasto: parseFloat(pesoG),
                custo: document.getElementById('resCusto').innerText,
                precoVenda: document.getElementById('resVenda').innerText,
                mkt: document.getElementById('selMkt').value
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    body: JSON.stringify(payload)
                });
                alert("Sucesso! Estoque atualizado.");
                location.reload(); // Recarrega para mostrar o novo estoque
            } catch (e) {
                alert("Erro ao salvar. Verifique o Apps Script.");
                btn.innerText = "CONFIRMAR E BAIXAR ESTOQUE";
                btn.disabled = false;
            }
        }

        // Iniciar carregamento
        window.onload = carregarDados;
    </script>
</body>
</html>
