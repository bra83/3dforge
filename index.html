<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>333 Studio - Gestão Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
            margin: 0; padding: 0;
        }

        .card-glass {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
        }

        .input-studio {
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            width: 100%;
            font-size: 16px; 
            outline: none;
            transition: all 0.2s;
        }
        .input-studio:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .spool-visual {
            width: 65px; height: 65px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            position: relative; background: #f1f5f9;
            overflow: hidden; border: 2px solid #e2e8f0;
        }
        .spool-progress {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: #3b82f6; transition: height 0.8s ease, background-color 0.5s ease; opacity: 0.9;
        }

        .nav-active { color: #3b82f6; border-bottom: 2px solid #3b82f6; }
        @media (max-width: 768px) {
            .nav-active { color: #3b82f6; border-bottom: none; transform: scale(1.1); }
        }

        .btn-primary {
            background: #0f172a;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.05em;
        }
        .btn-primary:active { transform: scale(0.97); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="pb-20 md:pb-0">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, Fragment } = React;

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                calc: <path d="M16 2H8a2 2 0 00-2 2v16a2 2 0 002 2h8a2 2 0 002-2V4a2 2 0 00-2-2zM8 6h8M8 10h8M8 14h8M8 18h8" />,
                stock: <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />,
                sales: <Fragment><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" /><path d="M3 6h18M16 10a4 4 0 01-8 0" /></Fragment>,
                settings: <Fragment><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" /></Fragment>,
                wallet: <path d="M20 12V8H6a2 2 0 012-2h12M4 10h16v10H4V10z" />,
                trash: <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" />,
                refresh: <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />,
                whatsapp: <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 1 1-7.6-7.6 8.38 8.38 0 0 1 3.8.9L21 4.5z" />
            };
            return (
                <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                    {icons[name]}
                </svg>
            );
        };

        const App = () => {
            const [page, setPage] = useState('calc');
            const HARDCODED_URL = "https://script.google.com/macros/s/AKfycbx28rB657FbmmBk05Ljd_HuBCFAGNSaflknIeF_BNYfDVUvODiZb5ry_whruDHFjcMNuw/exec";
            
            const [state, setState] = useState(() => {
                const saved = JSON.parse(localStorage.getItem('333_vFINAL_stable'));
                const defaults = {
                    aluguel: 210, softwares: 95, ecommerce: 59.9, mei: 60, publicidade: 100, condominio: 100,
                    kwh: 1.14, potencia: 350, precoMaq: 1500, vidaUtil: 24, FatPrevisto: 4000, 
                    horasTrab: 160, embalagem: 3, markup: 2.5, pintSimples: 15, pintMedia: 35, pintProf: 60,
                    urlWrite: HARDCODED_URL
                };
                return { estoque: [], vendas: [], gastos: [], syncing: false, settings: saved ? { ...saved, urlWrite: HARDCODED_URL } : defaults };
            });

            const [calcForm, setCalcForm] = useState({ nome: '', tempo: 10, pintura: 'media', whatsapp: '', filamentos: [{ id: Date.now(), matIdx: 0, peso: 100 }] });
            const [gastoForm, setGastoForm] = useState({ id: '', descricao: '', valor: '' });
            const [toast, setToast] = useState({ show: false, msg: '' });

            const notify = (msg) => { setToast({ show: true, msg }); setTimeout(() => setToast({ show: false, msg: '' }), 4000); };

            const extractColor = (name) => {
                const match = name.match(/"([^"]+)"/);
                if (!match) return '#3b82f6';
                const colorMap = { 'vermelho': '#ef4444', 'verde': '#22c55e', 'azul': '#3b82f6', 'preto': '#0f172a', 'branco': '#f8fafc', 'amarelo': '#eab308', 'cinza': '#64748b', 'laranja': '#f97316', 'rosa': '#ec4899', 'roxo': '#a855f7', 'marrom': '#78350f', 'dourado': '#fbbf24', 'prata': '#cbd5e1', 'cobre': '#b45309', 'transparente': '#e2e8f0', 'pele': '#ffdbac' };
                const raw = match[1].toLowerCase().trim();
                return colorMap[raw] || raw; 
            };

            const sync = async () => {
                setState(prev => ({ ...prev, syncing: true }));
                try {
                    const response = await fetch(`${state.settings.urlWrite}?type=read_data&nocache=${Date.now()}`);
                    const data = await response.json();
                    const settingsRes = await fetch(`${state.settings.urlWrite}?type=read_settings&nocache=${Date.now()}`);
                    const settingsData = await settingsRes.json();
                    const newSettings = { ...state.settings, ...settingsData, urlWrite: HARDCODED_URL };
                    localStorage.setItem('333_vFINAL_stable', JSON.stringify(newSettings));
                    setState(prev => ({ 
                        ...prev, estoque: data.estoque || [], vendas: data.vendas || [], 
                        gastos: (data.gastos || []).map(g => ({ ...g, id: String(g.id).trim().replace(/^g_/, ''), valor: Number(g.valor) })),
                        settings: newSettings, syncing: false 
                    }));
                } catch (e) { setState(p => ({ ...p, syncing: false })); notify("Erro de Ligação"); }
            };

            useEffect(() => { sync(); }, []);

            const metrics = useMemo(() => {
                const fat = state.vendas.reduce((acc, v) => acc + (Number(v.venda) || 0), 0);
                const luc = state.vendas.reduce((acc, v) => acc + (Number(v.lucro) || 0), 0);
                const out = state.gastos.reduce((acc, g) => acc + (Number(g.valor) || 0), 0);
                return { fat, luc, out, bal: luc - out };
            }, [state.vendas, state.gastos]);

            const simulacao = useMemo(() => {
                if (!state.estoque.length) return null;
                let cMat = 0;
                calcForm.filamentos.forEach(f => {
                    const mat = state.estoque[f.matIdx] || state.estoque[0];
                    cMat += (Number(f.peso) / 1000) * Number(mat.preco);
                });
                const cLuz = (Number(state.settings.potencia) / 1000) * Number(calcForm.tempo) * Number(state.settings.kwh);
                const cAmort = (Number(state.settings.precoMaq) / Number(state.settings.vidaUtil) / 30 / 24) * Number(calcForm.tempo);
                const tFixo = Number(state.settings.aluguel || 0) + Number(state.settings.softwares || 0) + Number(state.settings.ecommerce || 0) + Number(state.settings.mei || 0) + Number(state.settings.publicidade || 0) + Number(state.settings.condominio || 0);
                const divisor = (Number(state.settings.FatPrevisto) || 4000);
                const cFixoProp = (tFixo / divisor) * Number(calcForm.tempo);
                const base = cMat + cLuz + cAmort + cFixoProp + Number(state.settings.embalagem);
                let cPint = 0;
                if(calcForm.pintura === "simples") cPint = Number(state.settings.pintSimples);
                else if(calcForm.pintura === "media") cPint = Number(state.settings.pintMedia);
                else if(calcForm.pintura === "profissional") cPint = Number(state.settings.pintProf);
                const sug = (base + cPint) * Number(state.settings.markup);
                return { custoBase: base, sugerido: sug, lucro: sug - (base + cPint) };
            }, [calcForm, state.settings, state.estoque]);

            // LÓGICA DE EXCLUSÃO COPIADA EXATAMENTE DO SEU SNIPPET FUNCIONAL
            const apiCall = async (type, data) => {
                notify("A Processar...");
                if (type === 'delete_gasto') {
                    setState(p => ({ ...p, gastos: p.gastos.filter(g => String(g.id).trim() !== String(data.id).trim()) }));
                }
                const params = new URLSearchParams();
                params.append('type', type);
                Object.keys(data).forEach(k => { if(data[k] !== undefined && data[k] !== null) params.append(k, String(data[k]).trim()); });
                try {
                    await fetch(`${state.settings.urlWrite}?${params.toString()}`, { method: 'GET', mode: 'no-cors' });
                    setTimeout(sync, 2500);
                    notify("Operação Concluída");
                    return true;
                } catch (e) { notify("Sincronização pendente..."); return false; }
            };

            const navigation = [
                {id: 'calc', l: 'Calculadora', i: 'calc'},
                {id: 'stock', l: 'Estoque', i: 'stock'},
                {id: 'sales', l: 'Vendas', i: 'sales'},
                {id: 'expenses', l: 'Financeiro', i: 'wallet'},
                {id: 'settings', l: 'Ajustes', i: 'settings'}
            ];

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-40 px-4 md:px-8 py-4 shadow-sm">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="text-2xl font-black tracking-tighter text-slate-900 italic">333</div>
                                <div className="hidden sm:block text-[10px] font-bold uppercase tracking-widest text-slate-400">Print Studio</div>
                            </div>
                            <nav className="hidden md:flex items-center gap-6">
                                {navigation.map(n => (
                                    <button key={n.id} onClick={() => setPage(n.id)} className={`text-xs font-bold uppercase tracking-wider py-2 transition-all ${page === n.id ? 'nav-active' : 'text-slate-400 hover:text-slate-900'}`}>{n.l}</button>
                                ))}
                            </nav>
                            <button onClick={sync} className={`p-2 rounded-full hover:bg-slate-100 ${state.syncing ? 'animate-spin text-blue-500' : 'text-slate-400'}`}><Icon name="refresh" /></button>
                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl mx-auto w-full p-4 md:p-8 space-y-8 pb-28 md:pb-12">
                        {page === 'calc' && (
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                                <section className="lg:col-span-7 card-glass p-6 md:p-10 space-y-8">
                                    <h2 className="text-xl font-bold">Novo Orçamento</h2>
                                    <div className="space-y-5">
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black uppercase text-slate-400 ml-1">Projeto</label>
                                            <input className="input-studio" placeholder="Diorama Batman..." value={calcForm.nome} onChange={e=>setCalcForm({...calcForm, nome: e.target.value})} />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="space-y-1"><label className="text-[10px] font-black uppercase text-slate-400 ml-1">Tempo (h)</label><input type="number" className="input-studio" value={calcForm.tempo} onChange={e=>setCalcForm({...calcForm, tempo: e.target.value})} /></div>
                                            <div className="space-y-1"><label className="text-[10px] font-black uppercase text-slate-400 ml-1">Pintura</label>
                                                <select className="input-studio" value={calcForm.pintura} onChange={e=>setCalcForm({...calcForm, pintura: e.target.value})}>
                                                    <option value="none">Nenhum</option><option value="simples">Simples</option><option value="media">Média</option><option value="profissional">Profissional</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div className="space-y-4">
                                            <div className="flex justify-between items-center"><label className="text-[10px] font-black uppercase text-slate-400">Filamentos</label> <button onClick={() => setCalcForm({...calcForm, filamentos: [...calcForm.filamentos, {id: Date.now(), matIdx: 0, peso: 0}]})} className="text-[10px] font-black text-blue-600 uppercase">+ Adicionar</button></div>
                                            {calcForm.filamentos.map((f, i) => (
                                                <div key={f.id} className="flex gap-2">
                                                    <select className="input-studio flex-1" value={f.matIdx} onChange={e => {const n = [...calcForm.filamentos]; n[i].matIdx = e.target.value; setCalcForm({...calcForm, filamentos: n})}}>
                                                        {state.estoque.map((m, idx) => <option key={idx} value={idx}>{m.nome}</option>)}
                                                    </select>
                                                    <div className="relative w-28"><input type="number" className="input-studio pr-8" placeholder="0" value={f.peso} onChange={e => {const n = [...calcForm.filamentos]; n[i].peso = e.target.value; setCalcForm({...calcForm, filamentos: n})}} /><span className="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-bold text-slate-400">g</span></div>
                                                    {calcForm.filamentos.length > 1 && <button onClick={() => setCalcForm({...calcForm, filamentos: calcForm.filamentos.filter(x => x.id !== f.id)})} className="p-2 text-slate-300 hover:text-red-500 transition-colors"><Icon name="trash" className="w-4 h-4"/></button>}
                                                </div>
                                            ))}
                                        </div>
                                        <div className="pt-4 space-y-4">
                                            <input className="input-studio" placeholder="WhatsApp (DDD + Número)" value={calcForm.whatsapp} onChange={e=>setCalcForm({...calcForm, whatsapp: e.target.value})} />
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <button onClick={() => {if(!simulacao) return; const msg = `Olá! Segue o orçamento para o projeto: *${calcForm.nome || 'Impressão 3D'}*%0A%0A*Tempo estimado:* ${calcForm.tempo}h%0A*Valor Total:* R$ ${simulacao.sugerido.toFixed(2)}%0A%0A_Enviado via 333 Print Studio_`; window.open(`https://wa.me/${calcForm.whatsapp.replace(/\D/g, '') ? '55' + calcForm.whatsapp.replace(/\D/g, '') : ''}?text=${msg}`, '_blank'); }} className="btn-primary bg-emerald-600 hover:bg-emerald-500 flex items-center justify-center gap-2"><Icon name="whatsapp" /> Orçamento</button>
                                                <button onClick={() => apiCall('venda', { item: calcForm.nome || 'Venda Studio', venda: simulacao.sugerido.toFixed(2).replace('.', ','), lucro: simulacao.lucro.toFixed(2).replace('.', ',') })} className="btn-primary bg-blue-600 hover:bg-blue-500">Registrar Venda</button>
                                            </div>
                                        </div>
                                    </div>
                                </section>

                                <section className="lg:col-span-5 flex flex-col gap-6">
                                    <div className="card-glass p-10 text-center border-t-8 border-slate-900 bg-slate-50 shadow-xl">
                                        <p className="text-[11px] font-black uppercase tracking-[0.3em] text-slate-400 mb-2">Venda Sugerida</p>
                                        <h3 className="text-7xl font-black tracking-tighter text-slate-900 italic">R$ {simulacao?.sugerido.toFixed(2)}</h3>
                                        <div className="mt-10 grid grid-cols-2 gap-4 border-t border-slate-200 pt-8 text-center">
                                            <div><p className="text-[9px] font-bold uppercase text-slate-400">Custo Total</p><p className="text-xl font-bold">R$ {simulacao?.custoBase.toFixed(2)}</p></div>
                                            <div><p className="text-[9px] font-bold uppercase text-slate-400">Lucro Estimado</p><p className="text-xl font-bold text-emerald-600">R$ {simulacao?.lucro.toFixed(2)}</p></div>
                                        </div>
                                    </div>
                                </section>
                            </div>
                        )}

                        {page === 'stock' && (
                            <div className="space-y-8 text-center">
                                <div className="flex justify-between items-center px-2">
                                    <h2 className="text-2xl font-bold">Estoque</h2>
                                    <button onClick={() => {const n = prompt("Nome do Carretel (Ex: PLA \"Vermelho\"):"); if(n) apiCall('estoque', {nome:n, peso:1000, preco:120})}} className="btn-primary">+ Novo</button>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4 md:gap-6">
                                    {state.estoque.map((m, i) => (
                                        <div key={i} className="card-glass p-6 flex flex-col items-center space-y-4 group relative">
                                            <div className="spool-visual">
                                                <div className="spool-progress" style={{height: `${(Number(m.peso)/1000)*100}%`, backgroundColor: extractColor(m.nome)}}></div>
                                                <span className="z-10 text-[11px] font-bold text-slate-900 drop-shadow-sm">{m.peso}g</span>
                                            </div>
                                            <div className="h-10 flex items-center"><p className="text-[11px] font-bold uppercase leading-tight line-clamp-2 text-slate-800">{m.nome}</p></div>
                                            <button onClick={() => {if(confirm("Remover carretel?")) apiCall('delete_estoque', {nome: m.nome})}} className="opacity-0 group-hover:opacity-100 transition-opacity text-red-500"><Icon name="trash" className="w-4 h-4"/></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {page === 'expenses' && (
                            <div className="space-y-8">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 text-center">
                                    <div className="card-glass p-8 border-l-4 border-red-500"><p className="text-[10px] font-bold uppercase text-slate-400">Despesas</p><p className="text-3xl font-black text-red-500">R$ {metrics.out.toFixed(2)}</p></div>
                                    <div className="card-glass p-8 border-l-4 border-blue-600"><p className="text-[10px] font-bold uppercase text-slate-400">Lucro Bruto</p><p className="text-3xl font-black text-blue-600">R$ {metrics.luc.toFixed(2)}</p></div>
                                    <div className="card-glass p-8 border-l-4 border-emerald-500"><p className="text-[10px] font-bold uppercase text-slate-400">Saldo Caixa</p><p className={`text-3xl font-black ${metrics.bal >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>R$ {metrics.bal.toFixed(2)}</p></div>
                                </div>

                                <div className="card-glass p-8 space-y-6 border-dashed border-2">
                                    <h3 className="text-xs font-black uppercase text-slate-400 tracking-widest">Registrar Gasto</h3>
                                    <div className="flex flex-col md:flex-row gap-4">
                                        <input className="input-studio flex-1" placeholder="Ex: Peças, Luz, Aluguel..." value={gastoForm.descricao} onChange={e=>setGastoForm({...gastoForm, descricao: e.target.value})} />
                                        <div className="relative md:w-48"><input type="number" className="input-studio pl-8" placeholder="0,00" value={gastoForm.valor} onChange={e=>setGastoForm({...gastoForm, valor: e.target.value})} /><span className="absolute left-3 top-1/2 -translate-y-1/2 font-bold text-slate-400">R$</span></div>
                                        <button onClick={() => {if(gastoForm.descricao && gastoForm.valor) { apiCall('gasto', {descricao: gastoForm.descricao, valor: gastoForm.valor.replace(',', '.'), id: Date.now()}); setGastoForm({descricao:'', valor:''})}}} className="btn-primary md:px-12">Lançar</button>
                                    </div>
                                </div>

                                <div className="card-glass overflow-hidden">
                                    <div className="p-4 bg-slate-50 border-b border-slate-200"><h3 className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Histórico Financeiro</h3></div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm">
                                            <thead><tr className="border-b border-slate-200"><th className="p-4 font-black uppercase text-[10px] text-slate-400">Data</th><th className="p-4 font-black uppercase text-[10px] text-slate-400">Descrição</th><th className="p-4 font-black uppercase text-[10px] text-slate-400 text-right">Valor</th><th className="p-4 text-center">Ações</th></tr></thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {state.gastos.slice().reverse().map((g) => (
                                                    <tr key={String(g.id)} className="hover:bg-slate-50 transition-colors">
                                                        <td className="p-4 text-slate-400 text-xs">{g.data}</td>
                                                        <td className="p-4 font-bold uppercase text-xs text-slate-800">{g.descricao}</td>
                                                        <td className="p-4 text-right font-black text-red-500">R$ {Number(g.valor).toFixed(2)}</td>
                                                        <td className="p-4 text-center">
                                                            <button onClick={() => {if(window.confirm("Eliminar registo?")) apiCall('delete_gasto', {id: String(g.id).replace(/^g_/, '') })}} className="p-2 text-slate-300 hover:text-red-500 transition-all"><Icon name="trash" className="w-4 h-4"/></button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {page === 'sales' && (
                            <div className="space-y-8">
                                <div className="card-glass p-8 flex justify-between items-center bg-slate-900 text-white shadow-xl">
                                    <div><p className="text-[10px] font-bold uppercase text-slate-400 tracking-widest">Faturamento</p><p className="text-4xl font-black">R$ {metrics.fat.toFixed(2)}</p></div>
                                    <div className="text-right"><p className="text-[10px] font-bold uppercase text-slate-400 tracking-widest">Lucro Acumulado</p><p className="text-4xl font-black text-emerald-400">R$ {metrics.luc.toFixed(2)}</p></div>
                                </div>
                                <div className="card-glass overflow-hidden">
                                    <div className="p-4 bg-slate-50 border-b border-slate-200"><h3 className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Últimas Vendas</h3></div>
                                    <div className="overflow-x-auto"><table className="w-full text-left text-sm"><thead className="border-b border-slate-200"><tr><th className="p-4 text-[10px] text-slate-400 uppercase font-black">Data</th><th className="p-4 text-[10px] text-slate-400 uppercase font-black">Projeto</th><th className="p-4 text-[10px] text-slate-400 uppercase font-black text-right">Venda</th><th className="p-4 text-[10px] text-slate-400 uppercase font-black text-right">Lucro</th></tr></thead>
                                    <tbody className="divide-y divide-slate-100">{state.vendas.slice().reverse().map((v, i) => (<tr key={i} className="hover:bg-slate-50"><td className="p-4 text-slate-400 text-xs">{v.data}</td><td className="p-4 font-bold uppercase text-xs text-slate-800">{v.item}</td><td className="p-4 text-right font-bold text-xs text-slate-500">R$ {Number(v.venda).toFixed(2)}</td><td className="p-4 text-right font-black text-emerald-600">R$ {Number(v.lucro).toFixed(2)}</td></tr>))}</tbody></table></div>
                                </div>
                            </div>
                        )}

                        {page === 'settings' && (
                            <div className="max-w-4xl space-y-8 text-center mx-auto">
                                <h2 className="text-2xl font-bold">Ajustes Studio</h2>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                    {Object.keys(state.settings).filter(k => typeof state.settings[k] === 'number').map(key => (
                                        <div key={key} className="card-glass p-5 space-y-2">
                                            <label className="text-[9px] font-black uppercase text-slate-400 ml-1">{key}</label>
                                            <input type="number" step="0.01" value={state.settings[key]} onChange={e => setState({...state, settings: {...state.settings, [key]: Number(e.target.value)}})} className="w-full bg-transparent border-none p-0 font-bold text-xl text-center focus:ring-0 text-slate-800" />
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => apiCall('save_settings', state.settings)} className="btn-primary w-full shadow-lg shadow-blue-500/10">Salvar Ajustes na Nuvem</button>
                            </div>
                        )}
                    </main>

                    <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around p-4 z-50 shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
                        {navigation.map(n => (
                            <button key={n.id} onClick={() => setPage(n.id)} className={`flex flex-col items-center gap-1 transition-all ${page === n.id ? 'text-blue-600 scale-110' : 'text-slate-400'}`}>
                                <Icon name={n.id === 'expenses' ? 'wallet' : n.id} className="w-6 h-6" /><span className="text-[8px] font-black uppercase tracking-widest">{n.l.slice(0,4)}</span>
                            </button>
                        ))}
                    </nav>

                    {toast.show && (
                        <div className="fixed bottom-24 md:bottom-8 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl z-[100] font-bold text-xs uppercase tracking-widest animate-bounce">
                            {toast.msg}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
        <script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js");
  }
    </script>
</body>
</html>
