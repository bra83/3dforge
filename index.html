<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D_LOGISTICS_v3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --neon-green: #00ff41; --dark-bg: #0d0208; --panel-bg: #161b22; }
        body { background-color: var(--dark-bg); color: var(--neon-green); font-family: monospace; padding: 15px; }
        .card { background-color: var(--panel-bg); border: 1px solid var(--neon-green); border-radius: 4px; padding: 15px; margin-bottom: 15px; }
        input, select { background-color: #000; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 8px; width: 100%; margin-bottom: 8px; outline: none; font-size: 0.9rem; }
        .btn { padding: 12px; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; border: 1px solid var(--neon-green); transition: 0.2s; }
        .btn-main { background-color: var(--neon-green); color: #000; }
        .tab-btn { padding: 10px; cursor: pointer; border: 1px solid #333; flex-grow: 1; text-align: center; font-size: 0.7rem; }
        .active-tab { background-color: var(--neon-green); color: #000; font-weight: bold; }
        .content-section { display: none; }
        .content-section.active { display: block; }
        label { font-size: 0.7rem; opacity: 0.8; text-transform: uppercase; }
    </style>
</head>
<body>

    <header class="mb-4 text-center border-b border-green-900 pb-2">
        <h1 class="text-lg font-bold tracking-tighter">3D_MANAGEMENT_ULTIMATE_v3</h1>
    </header>

    <nav class="flex gap-1 mb-4">
        <div id="btn-1" class="tab-btn active-tab" onclick="switchTab(1)">CALCULADORA</div>
        <div id="btn-2" class="tab-btn" onclick="switchTab(2)">ESTOQUE</div>
        <div id="btn-3" class="tab-btn" onclick="switchTab(3)">CONFIG</div>
    </nav>

    <div id="content-1" class="content-section active">
        <div class="card">
            <label>> MATERIAL_BASE</label>
            <select id="selectMaterial" onchange="calcular()"></select>
            
            <div class="grid grid-cols-2 gap-2">
                <div><label>> PESO_PEÇA(G)</label><input type="number" id="pesoPeca" oninput="calcular()" value="0"></div>
                <div><label>> TEMPO_IMP(H)</label><input type="number" id="tempoHoras" oninput="calcular()" value="0"></div>
            </div>

            <label>> CANAL_DE_VENDA</label>
            <select id="mkt" onchange="calcular()">
                <option value="direta">VENDA DIRETA (MÃOS)</option>
                <option value="ml">MERCADO LIVRE (TAXA+FIXO)</option>
                <option value="shopee">SHOPEE (TAXA_PADRÃO)</option>
            </select>

            <div class="p-3 bg-black border border-green-900 rounded mb-4">
                <div class="text-[0.65rem] space-y-1 opacity-80">
                    <p>MATER+PURGA: <span id="detMat">R$ 0,00</span></p>
                    <p>LUZ+DEPREC: <span id="detFix">R$ 0,00</span></p>
                    <p>MÃO_OBRA+EMBAL: <span id="detExtra">R$ 0,00</span></p>
                </div>
                <div class="border-t border-green-900 mt-2 pt-2">
                    <p class="text-xs">CUSTO_TOTAL_PROD: <span id="resCusto">R$ 0,00</span></p>
                    <p class="text-base font-bold text-white">PREÇO_VENDA_FINAL: <span id="resVenda" class="text-green-400">R$ 0,00</span></p>
                </div>
            </div>
            <button class="btn btn-main" onclick="registrarPedido()">REGISTRAR_VENDA</button>
        </div>
    </div>

    <div id="content-2" class="content-section">
        <div class="card">
            <h2 class="mb-2 text-xs font-bold">> ENTRADA_FILAMENTO</h2>
            <input type="text" id="novoNome" placeholder="NOME/COR">
            <input type="number" id="novoPreco" placeholder="PREÇO_ROLO">
            <input type="number" id="novoPeso" placeholder="PESO_G_TOTAL">
            <button class="btn btn-main" onclick="adicionarFilamento()">SALVAR_DB</button>
        </div>
        <div class="card" id="listaEstoque"></div>
    </div>

    <div id="content-3" class="content-section">
        <div class="card">
            <h2 class="mb-3 text-xs font-bold">> VARIAVEIS_DE_CUSTO</h2>
            
            <label>VALOR_DA_HORA_TRABALHO (R$)</label>
            <input type="number" id="cfgMaoObra" value="15.00" oninput="calcular()">

            <label>CUSTO_EMBALAGEM_MEDIA (R$)</label>
            <input type="number" id="cfgEmbalagem" value="5.00" oninput="calcular()">

            <label>TAXA_DE_PURGA/SOPORTE (%)</label>
            <input type="number" id="cfgPurga" value="15" oninput="calcular()">

            <label>MARGEM_LUCRO_DESEJADA (%)</label>
            <input type="number" id="cfgLucroPerc" value="100" oninput="calcular()">

            <div class="grid grid-cols-2 gap-2">
                <div><label>ENERGIA(KWH)</label><input type="number" id="cfgKwh" value="0.85" oninput="calcular()"></div>
                <div><label>CONSUMO(W)</label><input type="number" id="cfgConsumo" value="150" oninput="calcular()"></div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div><label>VALOR_MAQ</label><input type="number" id="cfgMaqVal" value="2000" oninput="calcular()"></div>
                <div><label>VIDA_H</label><input type="number" id="cfgVidaH" value="5000" oninput="calcular()"></div>
            </div>
        </div>
    </div>

    <script>
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbws1Ltn_D-VG5s7utXwyBc1m5764U9naa26jo3tnR38UcEnq3270-0b6ttBlCVWr43m/exec"; 
        let dadosEstoque = [];

        function switchTab(n) {
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active-tab'));
            document.getElementById('content-' + n).classList.add('active');
            document.getElementById('btn-' + n).classList.add('active-tab');
        }

        async function carregarDados() {
            if(URL_SCRIPT.includes("COLE_AQUI")) return;
            try {
                const resp = await fetch(URL_SCRIPT);
                dadosEstoque = await resp.json();
                atualizarUI();
            } catch (e) { console.error("Erro na Planilha."); }
        }

        function atualizarUI() {
            const select = document.getElementById('selectMaterial');
            const lista = document.getElementById('listaEstoque');
            select.innerHTML = "";
            lista.innerHTML = "<h3 class='mb-2 opacity-50 text-[0.6rem]'>INVENTARIO_ATIVO</h3>";

            dadosEstoque.slice(1).forEach(item => {
                select.innerHTML += `<option value="${item[0]}">${item[0]}</option>`;
                lista.innerHTML += `<div class="flex justify-between text-[0.7rem] border-b border-green-900 py-1"><span>${item[0]}</span><span>${item[3]}g</span></div>`;
            });
        }

        function calcular() {
            const materialNome = document.getElementById('selectMaterial').value;
            const mat = dadosEstoque.find(i => i[0] === materialNome) || ["Padrão", 120, 1000, 1000];

            const peso = parseFloat(document.getElementById('pesoPeca').value) || 0;
            const horas = parseFloat(document.getElementById('tempoHoras').value) || 0;

            // Variáveis da Aba CONFIG
            const purgaPerc = (parseFloat(document.getElementById('cfgPurga').value) / 100) + 1;
            const maoObraHr = parseFloat(document.getElementById('cfgMaoObra').value);
            const embalagem = parseFloat(document.getElementById('cfgEmbalagem').value);
            const lucroPerc = (parseFloat(document.getElementById('cfgLucroPerc').value) / 100) + 1;
            const kwhVal = parseFloat(document.getElementById('cfgKwh').value);
            const consumoW = parseFloat(document.getElementById('cfgConsumo').value);
            const maqVal = parseFloat(document.getElementById('cfgMaqVal').value);
            const vidaH = parseFloat(document.getElementById('cfgVidaH').value);

            // Cálculos
            const custoMaterial = ((peso * purgaPerc) / mat[2]) * mat[1];
            const custoLuz = (consumoW / 1000) * horas * kwhVal; 
            const custoDeprec = (maqVal / vidaH) * horas; 
            const custoMaoObra = maoObraHr * horas;

            const custoTotal = custoMaterial + custoLuz + custoDeprec + custoMaoObra + embalagem;
            let precoComLucro = custoTotal * lucroPerc;

            // Marketplace
            const canal = document.getElementById('mkt').value;
            if(canal === 'ml') precoComLucro = (precoComLucro + 6) / 0.83;
            if(canal === 'shopee') precoComLucro = precoComLucro / 0.80;

            // Exibição
            document.getElementById('detMat').innerText = `R$ ${custoMaterial.toFixed(2)}`;
            document.getElementById('detFix').innerText = `R$ ${(custoLuz + custoDeprec).toFixed(2)}`;
            document.getElementById('detExtra').innerText = `R$ ${(custoMaoObra + embalagem).toFixed(2)}`;
            document.getElementById('resCusto').innerText = `R$ ${custoTotal.toFixed(2)}`;
            document.getElementById('resVenda').innerText = `R$ ${precoComLucro.toFixed(2)}`;
        }

        async function registrarPedido() {
            const data = {
                acao: "REGISTRAR_PEDIDO",
                material: document.getElementById('selectMaterial').value,
                peca: "Venda_3D",
                pesoGasto: parseFloat(document.getElementById('pesoPeca').value),
                custo: document.getElementById('resCusto').innerText,
                precoVenda: document.getElementById('resVenda').innerText,
                mkt: document.getElementById('mkt').value
            };
            await fetch(URL_SCRIPT, { method: 'POST', body: JSON.stringify(data) });
            alert("VENDA REGISTRADA!");
            carregarDados();
        }

        async function adicionarFilamento() {
            const data = {
                acao: "ADICIONAR_FILAMENTO",
                material: document.getElementById('novoNome').value,
                preco: parseFloat(document.getElementById('novoPreco').value),
                peso: parseFloat(document.getElementById('novoPeso').value)
            };
            await fetch(URL_SCRIPT, { method: 'POST', body: JSON.stringify(data) });
            alert("FILAMENTO ADICIONADO!");
            carregarDados();
        }

        carregarDados();
    </script>
</body>
</html>
