<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D_LOGISTICS_v4.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --neon: #00ff41; --bg: #0d0208; }
        body { background-color: var(--bg); color: var(--neon); font-family: monospace; padding: 15px; }
        .card { background-color: #161b22; border: 1px solid var(--neon); padding: 15px; margin-bottom: 15px; border-radius: 4px; }
        input, select { background-color: #000; border: 1px solid var(--neon); color: var(--neon); padding: 8px; width: 100%; margin-bottom: 10px; outline: none; }
        .btn { padding: 12px; font-weight: bold; width: 100%; cursor: pointer; border: 1px solid var(--neon); text-transform: uppercase; }
        .active { background-color: var(--neon); color: #000; }
        .hidden { display: none; }
    </style>
</head>
<body class="max-w-lg mx-auto">

    <nav class="flex gap-1 mb-4">
        <div id="t1" class="flex-1 text-center p-2 border border-green-900 active" onclick="tab(1)">CALC</div>
        <div id="t2" class="flex-1 text-center p-2 border border-green-900" onclick="tab(2)">ESTOQUE</div>
        <div id="t3" class="flex-1 text-center p-2 border border-green-900" onclick="tab(3)">CONFIG</div>
    </nav>

    <div id="c1" class="tab-content">
        <div class="card">
            <select id="selMat" onchange="calc()"></select>
            <input type="number" id="p" placeholder="PESO(G)" oninput="calc()">
            <input type="number" id="t" placeholder="HORAS" oninput="calc()">
            <select id="m" onchange="calc()">
                <option value="direta">DIRETA</option>
                <option value="ml">MERCADO LIVRE</option>
                <option value="shopee">SHOPEE</option>
            </select>
            <div class="p-2 border border-green-900 mb-4">
                <p class="text-xs">CUSTO: <span id="resC">R$ 0,00</span></p>
                <p class="text-xl font-bold">VENDA: <span id="resV">R$ 0,00</span></p>
            </div>
            <button class="btn active" onclick="sendP()">REGISTRAR VENDA</button>
        </div>
    </div>

    <div id="c2" class="tab-content hidden">
        <div class="card">
            <input type="text" id="nN" placeholder="NOME/COR">
            <input type="number" id="nP" placeholder="PREÇO ROLO">
            <input type="number" id="nW" placeholder="PESO TOTAL G">
            <button class="btn active" onclick="sendF()">GRAVAR NA PLANILHA</button>
        </div>
        <div class="card" id="list">Carregando estoque...</div>
    </div>

    <div id="c3" class="tab-content hidden">
        <div class="card">
            <label class="text-[10px]">LUCRO(%)</label><input type="number" id="cL" value="100">
            <label class="text-[10px]">MÃO DE OBRA/H</label><input type="number" id="cMO" value="15">
            <button class="btn active" onclick="saveL()">SALVAR CONFIGS</button>
        </div>
    </div>

    <script>
        const URL_BASE = "https://script.google.com/macros/s/AKfycbws1Ltn_D-VG5s7utXwyBc1m5764U9naa26jo3tnR38UcEnq3270-0b6ttBlCVWr43m/exec";
        let db = [];

        function tab(n){
            [1,2,3].forEach(i=>{
                document.getElementById('c'+i).classList.toggle('hidden', i!==n);
                document.getElementById('t'+i).classList.toggle('active', i===n);
            });
        }

        async function load(){
            const r = await fetch(URL_BASE);
            db = await r.json();
            const s = document.getElementById('selMat');
            const l = document.getElementById('list');
            s.innerHTML = ""; l.innerHTML = "ESTOQUE:<br>";
            db.slice(1).forEach(i=>{
                s.innerHTML+=`<option value="${i[0]}">${i[0]}</option>`;
                l.innerHTML+=`<div class="text-[10px] mb-1">${i[0]}: ${i[3]}g</div>`;
            });
            calc();
        }

        function calc(){
            const mat = db.find(i=>i[0]===document.getElementById('selMat').value) || ["-",120,1000,1000];
            const peso = parseFloat(document.getElementById('p').value)||0;
            const horas = parseFloat(document.getElementById('t').value)||0;
            const cM = (peso/mat[2])*mat[1];
            const cT = cM + (parseFloat(document.getElementById('cMO').value)*horas);
            let v = cT * (1+(parseFloat(document.getElementById('cL').value)/100));
            if(document.getElementById('m').value==='ml') v=(v+6)/0.83;
            if(document.getElementById('m').value==='shopee') v=v/0.80;
            document.getElementById('resC').innerText="R$ "+cT.toFixed(2);
            document.getElementById('resV').innerText="R$ "+v.toFixed(2);
        }

        async function sendF(){
            const n = document.getElementById('nN').value;
            const p = document.getElementById('nP').value;
            const w = document.getElementById('nW').value;
            // O segredo: enviamos tudo no LINK
            const link = `${URL_BASE}?acao=ADICIONAR_FILAMENTO&material=${n}&preco=${p}&peso=${w}`;
            
            alert("Enviando comando...");
            await fetch(link, {mode: 'no-cors'});
            
            setTimeout(()=>{ alert("Comando enviado. Recarregue a página em 5 segundos."); load(); }, 2000);
        }

        async function sendP(){
            const mat = document.getElementById('selMat').value;
            const peso = document.getElementById('p').value;
            const cust = document.getElementById('resC').innerText;
            const vend = document.getElementById('resV').innerText;
            const mkt = document.getElementById('m').value;
            
            const link = `${URL_BASE}?acao=REGISTRAR_PEDIDO&material=${mat}&pesoGasto=${peso}&custo=${cust}&precoVenda=${vend}&mkt=${mkt}`;
            
            await fetch(link, {mode: 'no-cors'});
            alert("Pedido enviado!");
            setTimeout(load, 2000);
        }

        function saveL(){
            localStorage.setItem('cL', document.getElementById('cL').value);
            localStorage.setItem('cMO', document.getElementById('cMO').value);
            alert("Salvo!");
            calc();
        }

        load();
    </script>
</body>
</html>
