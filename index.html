<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Precificação 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial; background:#111; color:#fff; padding:15px }
h1 { margin-top:0 }
section { display:none }
section.active { display:block }
input, select, button {
  width:100%; padding:10px; margin:6px 0; font-size:16px;
}
button { background:#00c853; border:none; font-weight:bold }
.box { background:#1e1e1e; padding:15px; border-radius:10px; margin-bottom:15px }
ul { padding-left:18px }
.result { background:#000; padding:10px; border-radius:6px; margin-top:10px }
</style>
</head>

<body>

<h1>Precificação 3D</h1>

<button onclick="show('estoque')">Estoque</button>
<button onclick="show('projeto')">Projeto</button>

<!-- ================= ESTOQUE ================= -->
<section id="estoque" class="box active">
  <h2>Filamentos</h2>

  <input id="nome" placeholder="Nome do filamento">
  <input id="preco" type="number" step="0.01" placeholder="Preço por grama (R$)">
  <input id="saldo" type="number" placeholder="Saldo (g)">

  <button onclick="addFilamento()">Adicionar Filamento</button>

  <h3>Estoque Atual</h3>
  <ul id="lista"></ul>
</section>

<!-- ================= PROJETO ================= -->
<section id="projeto" class="box">
  <h2>Projeto</h2>

  <label>Modo do projeto</label>
  <select id="modo">
    <option value="simular">Simular (não baixa estoque)</option>
    <option value="realizar">Realizar (baixa estoque)</option>
  </select>

  <label>Filamento</label>
  <select id="fil"></select>

  <label>Peso do projeto (g)</label>
  <input id="peso" type="number">

  <label>Horas de impressão</label>
  <input id="horas" type="number">

  <button onclick="calcularProjeto()">Calcular</button>

  <div class="result">
    <div id="res">Preço: R$ 0,00</div>
    <div id="info"></div>
  </div>
</section>

<script>
/* ================= CONFIG FIXA ================= */

const FORM_URL =
  "https://docs.google.com/forms/d/e/1FAIpQLSf26oMv7EjnQC124clAojJSrWSwCLl4Afqe1fk5No7WBfDP0w/formResponse";

const ENTRY_ACTION  = "entry.1318253980";
const ENTRY_PAYLOAD = "entry.1973534829";

/* URL do Apps Script (LEITURA) */
const API_URL = "COLE_AQUI_SUA_URL_EXEC";

/* ================= ESTADO ================= */

let estado = {
  estoque: []
};

/* ================= NAVEGAÇÃO ================= */

function show(id){
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ================= BACKEND ================= */

async function salvarEstado(){
  const form = new FormData();
  form.append(ENTRY_ACTION, "save");
  form.append(ENTRY_PAYLOAD, JSON.stringify(estado));

  await fetch(FORM_URL, {
    method: "POST",
    body: form,
    mode: "no-cors"
  });
}

async function carregarEstado(){
  const r = await fetch(API_URL);
  estado = await r.json();
  render();
}

/* ================= ESTOQUE ================= */

function addFilamento(){
  const n = nome.value.trim();
  const p = Number(preco.value);
  const s = Number(saldo.value);

  if(!n || p <= 0 || s <= 0){
    alert("Preencha corretamente");
    return;
  }

  estado.estoque.push({ nome:n, preco:p, saldo:s });

  salvarEstado().then(carregarEstado);

  nome.value = "";
  preco.value = "";
  saldo.value = "";
}

function render(){
  lista.innerHTML = "";
  fil.innerHTML = "";

  estado.estoque.forEach((f,i)=>{
    lista.innerHTML += `<li>${f.nome} — ${f.saldo} g</li>`;
    fil.innerHTML += `<option value="${i}">${f.nome}</option>`;
  });
}

/* ================= PROJETO ================= */

function calcularProjeto(){
  if(estado.estoque.length === 0){
    alert("Cadastre um filamento primeiro");
    return;
  }

  const idx = fil.value;
  const f = estado.estoque[idx];
  const p = Number(peso.value);
  const h = Number(horas.value);
  const modoProjeto = modo.value;

  if(p <= 0 || h <= 0){
    alert("Valores inválidos");
    return;
  }

  if(modoProjeto === "realizar" && p > f.saldo){
    alert("Estoque insuficiente");
    return;
  }

  /* Cálculo simples (pode evoluir depois) */
  const custoFilamento = p * f.preco;
  const custoHora = h * 1.0;
  const total = custoFilamento + custoHora;

  res.innerText = "Preço: R$ " + total.toFixed(2);

  if(modoProjeto === "simular"){
    info.innerText = "Simulação: estoque NÃO alterado.";
  } else {
    f.saldo -= p;
    info.innerText = `Projeto realizado. ${p} g removidos do estoque.`;
    salvarEstado().then(carregarEstado);
  }
}

/* ================= INIT ================= */

carregarEstado();
</script>

</body>
</html>
